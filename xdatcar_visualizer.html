function BondStatsPanel({parsed,th}){
  const {frames,atomElements,elementSymbols}=parsed;
  // Independent bond-rule state from the 3D viewer's Bond Settings — this
  // panel only needs the resulting bonds[] list, not the 3D display, so it
  // is kept self-contained rather than lifting state up to share it.
  const [bondRules,setBondRules]=useState(()=>buildDefaultBondRules(elementSymbols).map(r=>({...r,enabled:true})));
  const [replicaMargin,setReplicaMargin]=useState(0.2); // unused by the histograms; kept so BondSettings can be reused unmodified
  const [showSettings,setShowSettings]=useState(false);
  const [lengthBinWidth,setLengthBinWidth]=useState(0.05);
  const [angleBinWidth,setAngleBinWidth]=useState(2);
  const [frameIdx,setFrameIdx]=useState(0);
  const [lengthPairSel,setLengthPairSel]=useState("ALL");
  const [angleTripletSel,setAngleTripletSel]=useState("ALL");
  const safeFrameIdx = Math.min(frameIdx, frames.length-1);

  const bonds = useMemo(()=>
    findBondsAndReplicas(frames[safeFrameIdx], atomElements, bondRules, 0, [0,0,0], [1,1,1]).bonds,
    [frames, atomElements, bondRules, safeFrameIdx]
  );

  const pairKeys = useMemo(()=>[...new Set(bonds.map(b=>[b.elA,b.elB].sort().join("-")))].sort(), [bonds]);
  const tripletKeys = useMemo(()=>{
    const vertexMap = new Map();
    const posKey = p => `${p[0].toFixed(4)},${p[1].toFixed(4)},${p[2].toFixed(4)}`;
    function addNeighbor(centerPos, centerEl, neighborEl) {
      const key = posKey(centerPos);
      if (!vertexMap.has(key)) vertexMap.set(key, { el:centerEl, neighbors:[] });
      vertexMap.get(key).neighbors.push(neighborEl);
    }
    bonds.forEach(b => { addNeighbor(b.pA,b.elA,b.elB); addNeighbor(b.pB,b.elB,b.elA); });
    const keys=new Set();
    vertexMap.forEach(v=>{
      for(let i=0;i<v.neighbors.length;i++)
        for(let j=i+1;j<v.neighbors.length;j++){
          const a=v.neighbors[i], c=v.neighbors[j];
          keys.add(a<=c ? `${a}-${v.el}-${c}` : `${c}-${v.el}-${a}`);
        }
    });
    return [...keys].sort();
  }, [bonds]);

  const lengthHist = useMemo(()=>computeBondLengthHistogram(bonds, lengthPairSel==="ALL"?null:lengthPairSel, lengthBinWidth), [bonds, lengthPairSel, lengthBinWidth]);
  const angleHist  = useMemo(()=>computeBondAngleHistogram(bonds, angleTripletSel==="ALL"?null:angleTripletSel, angleBinWidth), [bonds, angleTripletSel, angleBinWidth]);

  const lengthData = Array.from(lengthHist.counts).map((c,i)=>({ r:+((lengthHist.edges[i]+lengthHist.edges[i+1])/2).toFixed(3), count:c }));
  const angleData  = Array.from(angleHist.counts).map((c,i)=>({ deg:+((angleHist.edges[i]+angleHist.edges[i+1])/2).toFixed(2), count:c }));

  const exportLengthCSV=()=>downloadTextFile("bond_length_histogram.csv","text/csv",toCSV(lengthData,[{key:"r",label:"Bond length (A)"},{key:"count",label:"Count"}]));
  const exportAngleCSV=()=>downloadTextFile("bond_angle_histogram.csv","text/csv",toCSV(angleData,[{key:"deg",label:"Angle (deg)"},{key:"count",label:"Count"}]));

  const enabledCount = bondRules.filter(r=>r.enabled).length;

  return (
    <div>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:12,flexWrap:"wrap",gap:8}}>
        <SectionTitle style={{margin:0}}>Bond Length &amp; Angle Distributions</SectionTitle>
        <button onClick={()=>setShowSettings(v=>!v)} style={togBtnStyle(showSettings,"#3b82f6",th)}>
          Bond rules ({enabledCount})
        </button>
      </div>
      {showSettings && (
        <BondSettings elementSymbols={elementSymbols} bondRules={bondRules} setBondRules={setBondRules}
          replicaMargin={replicaMargin} setReplicaMargin={setReplicaMargin} th={th}/>
      )}
      {frames.length>1 && (
        <div style={{display:"flex",alignItems:"center",gap:6,margin:"12px 0"}}>
          <span style={{color:th?th.muted:"#64748b",fontSize:12}}>Frame</span>
          <input type="range" min={0} max={frames.length-1} value={safeFrameIdx}
            onChange={e=>setFrameIdx(+e.target.value)}
            style={sliderStyle(safeFrameIdx,0,frames.length-1,"#3b82f6",{flex:1,maxWidth:240})}/>
          <span style={{color:th?th.muted:"#94a3b8",fontSize:11}}>{safeFrameIdx+1}/{frames.length}</span>
        </div>
      )}

      {bonds.length===0 ? (
        <div style={{marginTop:12,color:th?th.mutedAlt:"#475569",fontSize:12}}>
          No bonds found for the current settings — enable pairs and adjust distance ranges in "Bond rules" above.
        </div>
      ) : (
        <>
          {/* Bond length histogram */}
          <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginTop:20,marginBottom:8,flexWrap:"wrap",gap:8}}>
            <SectionTitle style={{margin:0}}>Bond Length ({bonds.length} bonds)</SectionTitle>
            <button onClick={exportLengthCSV} style={btnS(th?th.inputBg:"#1e293b",th)}>Export CSV</button>
          </div>
          <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:8}}>
            <span style={{color:th?th.muted:"#64748b",fontSize:12}}>bin width</span>
            <input type="number" min={0.001} max={1} step={0.005} value={lengthBinWidth}
              onChange={e=>setLengthBinWidth(Math.max(0.001,+e.target.value||0.05))}
              style={{width:60,background:th?th.inputBg:"#1e293b",color:th?th.text:"#e2e8f0",border:"1px solid "+(th?th.borderMid:"#334155"),borderRadius:4,padding:"3px 6px",fontSize:12}}/>
            <span style={{color:th?th.muted:"#64748b",fontSize:11}}>Å</span>
          </div>
          <div style={{display:"flex",flexWrap:"wrap",gap:6,marginBottom:10}}>
            <button onClick={()=>setLengthPairSel("ALL")} style={{padding:"2px 8px",borderRadius:4,fontSize:11,cursor:"pointer",background:lengthPairSel==="ALL"?"#3b82f633":"#0f172a",color:lengthPairSel==="ALL"?"#60a5fa":"#475569",border:"1px solid "+(lengthPairSel==="ALL"?"#3b82f6":"#1e293b")}}>All pairs</button>
            {pairKeys.map(k=>(
              <button key={k} onClick={()=>setLengthPairSel(k)} style={{padding:"2px 8px",borderRadius:4,fontSize:11,cursor:"pointer",background:lengthPairSel===k?"#3b82f633":"#0f172a",color:lengthPairSel===k?"#60a5fa":"#475569",border:"1px solid "+(lengthPairSel===k?"#3b82f6":"#1e293b")}}>{k}</button>
            ))}
          </div>
          <ResponsiveContainer width="100%" height={220}>
            <BarChart data={lengthData} margin={{top:4,right:20,left:10,bottom:4}}>
              <CartesianGrid strokeDasharray="3 3" stroke="#1e3a5f"/>
              <XAxis dataKey="r" stroke="#64748b" tick={{fill:"#94a3b8",fontSize:11}} label={{value:"Bond length (Å)",position:"insideBottom",offset:-2,fill:"#64748b",fontSize:11}}/>
              <YAxis stroke="#64748b" tick={{fill:"#94a3b8",fontSize:11}} allowDecimals={false}/>
              <Tooltip content={<CustomTooltip/>}/>
              <Bar dataKey="count" fill="#60a5fa" name="Count" isAnimationActive={false}/>
            </BarChart>
          </ResponsiveContainer>

          {/* Bond angle histogram */}
          <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginTop:24,marginBottom:8,flexWrap:"wrap",gap:8}}>
            <SectionTitle style={{margin:0}}>Bond Angle</SectionTitle>
            <button onClick={exportAngleCSV} style={btnS(th?th.inputBg:"#1e293b",th)}>Export CSV</button>
          </div>
          <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:8}}>
            <span style={{color:th?th.muted:"#64748b",fontSize:12}}>bin width</span>
            <input type="number" min={0.5} max={30} step={0.5} value={angleBinWidth}
              onChange={e=>setAngleBinWidth(Math.max(0.5,+e.target.value||2))}
              style={{width:60,background:th?th.inputBg:"#1e293b",color:th?th.text:"#e2e8f0",border:"1px solid "+(th?th.borderMid:"#334155"),borderRadius:4,padding:"3px 6px",fontSize:12}}/>
            <span style={{color:th?th.muted:"#64748b",fontSize:11}}>°</span>
          </div>
          <div style={{display:"flex",flexWrap:"wrap",gap:6,marginBottom:10}}>
            <button onClick={()=>setAngleTripletSel("ALL")} style={{padding:"2px 8px",borderRadius:4,fontSize:11,cursor:"pointer",background:angleTripletSel==="ALL"?"#3b82f633":"#0f172a",color:angleTripletSel==="ALL"?"#60a5fa":"#475569",border:"1px solid "+(angleTripletSel==="ALL"?"#3b82f6":"#1e293b")}}>All triplets</button>
            {tripletKeys.map(k=>(
              <button key={k} onClick={()=>setAngleTripletSel(k)} style={{padding:"2px 8px",borderRadius:4,fontSize:11,cursor:"pointer",background:angleTripletSel===k?"#3b82f633":"#0f172a",color:angleTripletSel===k?"#60a5fa":"#475569",border:"1px solid "+(angleTripletSel===k?"#3b82f6":"#1e293b")}}>{k}</button>
            ))}
          </div>
          <ResponsiveContainer width="100%" height={220}>
            <BarChart data={angleData} margin={{top:4,right:20,left:10,bottom:4}}>
              <CartesianGrid strokeDasharray="3 3" stroke="#1e3a5f"/>
              <XAxis dataKey="deg" stroke="#64748b" tick={{fill:"#94a3b8",fontSize:11}} label={{value:"Angle (°)",position:"insideBottom",offset:-2,fill:"#64748b",fontSize:11}}/>
              <YAxis stroke="#64748b" tick={{fill:"#94a3b8",fontSize:11}} allowDecimals={false}/>
              <Tooltip content={<CustomTooltip/>}/>
              <Bar dataKey="count" fill="#34d399" name="Count" isAnimationActive={false}/>
            </BarChart>
          </ResponsiveContainer>
        </>
      )}
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════
// Summary Card
// ═══════════════════════════════════════════════════════════════

function SummaryCard({parsed,th}){
  const {systemName,frames,elementSymbols,elementCounts,totalAtoms,isVariableCell}=parsed;
  const vols=frames.map(f=>f.volume);
  const volMin=Math.min(...vols),volMax=Math.max(...vols),volMean=vols.reduce((a,b)=>a+b,0)/vols.length;
  return (
    <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(155px,1fr))",gap:10,marginBottom:20}}>
      {[
        {label:"System",value:systemName||"—"},{label:"Frames",value:frames.length},{label:"Atoms",value:totalAtoms},
        {label:"Species",value:elementSymbols.map((s,i)=>`${s}${elementCounts[i]}`).join(" ")},
        {label:"Cell type",value:isVariableCell?"Variable":"Fixed"},
        {label:"Vol. mean",value:volMean.toFixed(2),unit:"vol"},{label:"Vol. min",value:volMin.toFixed(2),unit:"vol"},{label:"Vol. max",value:volMax.toFixed(2),unit:"vol"},
      ].map(({label,value,unit})=>(
        <div key={label} style={{background:th?th.panelAlt:"#0f172a",border:"1px solid "+(th?th.border:"#1e3a5f"),borderRadius:8,padding:"10px 14px"}}>
          <div style={{color:th?th.muted:"#64748b",fontSize:11,marginBottom:4}}>{label}</div>
          <div style={{color:th?th.text:"#e2e8f0",fontSize:13,fontWeight:500,wordBreak:"break-all"}}>
            {value}{unit==="vol"&&<span> Å<sup>3</sup></span>}
          </div>
        </div>
      ))}
    </div>
  );
}

function SectionTitle({children,style}){
  return <h3 style={{color:"#93c5fd",fontSize:13,fontWeight:600,letterSpacing:"0.05em",textTransform:"uppercase",marginBottom:10,...style}}>{children}</h3>;
}

// ═══════════════════════════════════════════════════════════════
// Drop Zone
// ═══════════════════════════════════════════════════════════════

function DropZone({onFile,th}){
  const [over,setOver]=useState(false);
  const ref=useRef();
  return (
    <div onDragOver={e=>{e.preventDefault();setOver(true);}} onDragLeave={()=>setOver(false)}
         onDrop={e=>{e.preventDefault();setOver(false);const f=e.dataTransfer.files[0];if(f)onFile(f);}}
         onClick={()=>ref.current.click()}
         style={{border:"2px dashed "+(over?"#3b82f6":th?th.border:"#1e3a5f"),borderRadius:12,padding:"48px 24px",textAlign:"center",cursor:"pointer",transition:"border-color 0.2s",background:over?"#172033":th?th.panelAlt:"#0f172a"}}>
      <input ref={ref} type="file" style={{display:"none"}} onChange={e=>{if(e.target.files[0])onFile(e.target.files[0]);}}/>
      <div style={{fontSize:36,marginBottom:12}}>📂</div>
      <p style={{color:"#60a5fa",fontSize:15,fontWeight:600,margin:"0 0 6px"}}>Drop XDATCAR file here</p>
      <p style={{color:th?th.mutedAlt:"#475569",fontSize:13,margin:0}}>or click to browse — VASP MD trajectory files accepted</p>
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════
// Main App
// ═══════════════════════════════════════════════════════════════

// ═══════════════════════════════════════════════════════════════
// Background theme definitions
// Each theme specifies colours for:
//   page   : outer page background
//   canvas : Three.js renderer clear colour (hex number)
//   panel  : card / tab-panel background
//   border : divider / border colour
//   text   : primary text
//   muted  : secondary / muted text
// ═══════════════════════════════════════════════════════════════

const BG_THEMES = {
  "Dark navy": {
    page:"#030712", canvas:0x0a1628, panel:"#0a1628",
    panelAlt:"#0f172a", border:"#1e3a5f", borderMid:"#334155",
    text:"#e2e8f0", muted:"#64748b", mutedAlt:"#475569",
    inputBg:"#1e293b",
  },
  "True black": {
    page:"#000000", canvas:0x0d0d0d, panel:"#0d0d0d",
    panelAlt:"#141414", border:"#2a2a2a", borderMid:"#3a3a3a",
    text:"#e8e8e8", muted:"#707070", mutedAlt:"#505050",
    inputBg:"#1a1a1a",
  },
  "Dark gray": {
    page:"#1a1a1a", canvas:0x232323, panel:"#232323",
    panelAlt:"#2a2a2a", border:"#3a3a3a", borderMid:"#4a4a4a",
    text:"#e2e2e2", muted:"#888888", mutedAlt:"#666666",
    inputBg:"#333333",
  },
  "Soft white": {
    page:"#f5f5f5", canvas:0xf0f0f0, panel:"#ffffff",
    panelAlt:"#f8f8f8", border:"#d0d0d0", borderMid:"#bbbbbb",
    text:"#1a1a1a", muted:"#666666", mutedAlt:"#888888",
    inputBg:"#ebebeb",
  },
  "Warm cream": {
    page:"#faf6f0", canvas:0xf5f0e8, panel:"#ffffff",
    panelAlt:"#fdf9f4", border:"#d9cfc4", borderMid:"#c4b8aa",
    text:"#2d2016", muted:"#7a6a55", mutedAlt:"#9a8a75",
    inputBg:"#ede8e0",
  },
  "Light gray": {
    page:"#eaeaea", canvas:0xe2e2e2, panel:"#f4f4f4",
    panelAlt:"#ececec", border:"#c8c8c8", borderMid:"#b0b0b0",
    text:"#1c1c1c", muted:"#6a6a6a", mutedAlt:"#888888",
    inputBg:"#dedede",
  },
  "Pale blue": {
    page:"#eef2f7", canvas:0xe8edf5, panel:"#f6f8fc",
    panelAlt:"#eef2f7", border:"#c4cfe0", borderMid:"#aabbd0",
    text:"#1a2540", muted:"#5a6880", mutedAlt:"#7a8898",
    inputBg:"#dce4ef",
  },
};

const TABS=["Structure 3D","Cell","Coordinates","MSD","RDF","Bond Stats"];

function App(){
  const [parsed,setParsed]=useState(null);
  const [error,setError]=useState(null);
  const [fileName,setFileName]=useState("");
  const [loading,setLoading]=useState(false);
  const [tab,setTab]=useState("Structure 3D");
  const [themeName,setThemeName]=useState("Dark navy");
  const th=BG_THEMES[themeName];
  const handleFile=useCallback((file)=>{
    setError(null);
    setLoading(true);
    parseXDATCARAsync(file).then(r=>{
      if(!r.frames.length) throw new Error("No frames found in file.");
      setParsed(r); setFileName(file.name); setTab("Structure 3D");
    }).catch(e=>{
      setError(e.message); setParsed(null);
    }).finally(()=>{
      setLoading(false);
    });
  },[]);
  return (
    <div style={{minHeight:"100vh",background:th.page,fontFamily:"'Inter','Helvetica Neue',sans-serif",color:th.text,transition:"background 0.25s,color 0.25s"}}>
      <div style={{borderBottom:"1px solid "+th.border,padding:"14px 28px",display:"flex",alignItems:"center",gap:16,flexWrap:"wrap"}}>
        <div style={{width:36,height:36,borderRadius:8,background:"linear-gradient(135deg,#1d4ed8,#7c3aed)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:22,color:"#ffffff"}}>&#9883;</div>
        <div>
          <div style={{fontSize:15,fontWeight:700,color:th.text,letterSpacing:"-0.01em"}}>XDATCAR Visualizer</div>
          <div style={{fontSize:11,color:th.muted}}>VASP crystal structure analysis</div>
        </div>
        {/* Background theme selector */}
        <div style={{display:"flex",alignItems:"center",gap:6,marginLeft:"auto"}}>
          <span style={{fontSize:11,color:th.muted,whiteSpace:"nowrap"}}>Background</span>
          <div style={{display:"flex",gap:4}}>
            {Object.keys(BG_THEMES).map(name=>{
              const t2=BG_THEMES[name];
              const active=name===themeName;
              return (
                <button key={name} title={name} onClick={()=>setThemeName(name)}
                  style={{width:18,height:18,borderRadius:"50%",cursor:"pointer",padding:0,
                    background:t2.page,
                    border:active?"2px solid #3b82f6":"2px solid "+th.borderMid,
                    boxShadow:active?"0 0 0 2px #3b82f688":"none",
                    flexShrink:0,
                  }}/>
              );
            })}
          </div>
          <span style={{fontSize:11,color:th.muted,minWidth:70}}>{themeName}</span>
        </div>
        {fileName&&<div style={{background:th.panelAlt,border:"1px solid "+th.border,borderRadius:6,padding:"4px 10px",fontSize:12,color:"#60a5fa"}}>{fileName}</div>}
        {parsed&&<button onClick={()=>{setParsed(null);setFileName("");setError(null);}} style={{background:"none",border:"1px solid "+th.borderMid,borderRadius:6,color:th.muted,fontSize:12,padding:"4px 10px",cursor:"pointer"}}>New file</button>}
      </div>
      <div style={{maxWidth:980,margin:"0 auto",padding:"24px 20px"}}>
        {!parsed&&(
          <>
            {loading ? (
              <div style={{border:"2px dashed "+th.border,borderRadius:12,padding:"48px 24px",textAlign:"center",background:th.panelAlt}}>
                <div style={{fontSize:36,marginBottom:12}}>⏳</div>
                <p style={{color:"#60a5fa",fontSize:15,fontWeight:600,margin:"0 0 6px"}}>Parsing XDATCAR file…</p>
                <p style={{color:th.mutedAlt,fontSize:13,margin:0}}>Running off the main thread — large trajectories may take a few seconds, but the page stays responsive.</p>
              </div>
            ) : (
              <DropZone onFile={handleFile} th={th}/>
            )}
            {error&&<div style={{marginTop:16,background:"#3b0f0f",border:"1px solid #7f1d1d",borderRadius:8,padding:"12px 16px",color:"#fca5a5",fontSize:13}}><strong>Parse error:</strong> {error}</div>}
            <div style={{marginTop:20,padding:"14px 18px",background:th.panelAlt,border:"1px solid "+th.border,borderRadius:8}}>
              <p style={{color:th.muted,fontSize:12,margin:0}}>
                Accepts standard VASP XDATCAR format (fixed-cell NVT and variable-cell NPT).
                Bonds are drawn only from atoms inside the unit cell [0,1). When a bonded
                neighbor lies outside the cell, its periodic image (replica atom) is shown
                as a translucent ghost sphere. Requires an internet connection on first load.
              </p>
            </div>
          </>
        )}
        {parsed&&(
          <>
            {parsed.warnings&&parsed.warnings.length>0&&(
              <div style={{marginBottom:16,background:"#3b2f0f",border:"1px solid #92660a",borderRadius:8,padding:"12px 16px",color:"#fcd34d",fontSize:13}}>
                <strong>Parse warning{parsed.warnings.length>1?"s":""}:</strong>
                <ul style={{margin:"4px 0 0",paddingLeft:18}}>
                  {parsed.warnings.map((w,i)=><li key={i}>{w}</li>)}
                </ul>
              </div>
            )}
            <SummaryCard parsed={parsed} th={th}/>
            <div style={{display:"flex",gap:2,marginBottom:20,borderBottom:"1px solid "+th.border,overflowX:"auto"}}>
              {TABS.map(t=>(
                <button key={t} onClick={()=>setTab(t)} style={{padding:"8px 16px",fontSize:13,cursor:"pointer",whiteSpace:"nowrap",background:"none",border:"none",borderBottom:tab===t?"2px solid #3b82f6":"2px solid transparent",color:tab===t?"#60a5fa":th.mutedAlt,fontWeight:tab===t?600:400,marginBottom:-1}}>{t}</button>
              ))}
            </div>
            <div style={{background:th.panel,border:"1px solid "+th.border,borderRadius:10,padding:"20px 22px"}}>
              {/* All panels are always mounted; hidden via display:none to preserve state.
                   Unmounting with && would reset all StructureViewer state and destroy
                   the Three.js scene every time the user switches tabs. The canvas's own
                   ResizeObserver (in StructureViewer's scene-init effect) re-measures it
                   automatically once its container becomes visible again. */}
              <div style={{display:tab==="Structure 3D"?"block":"none"}}>
                <StructureViewer parsed={parsed} th={th}/>
              </div>
              <div style={{display:tab==="Cell"?"block":"none"}}><CellPanel        parsed={parsed} th={th}/></div>
              <div style={{display:tab==="Coordinates"?"block":"none"}}><AtomicCoordPanel parsed={parsed} th={th}/></div>
              <div style={{display:tab==="MSD"?"block":"none"}}><DisplacementPanel parsed={parsed} th={th}/></div>
              <div style={{display:tab==="RDF"?"block":"none"}}><RDFPanel parsed={parsed} th={th}/></div>
              <div style={{display:tab==="Bond Stats"?"block":"none"}}><BondStatsPanel parsed={parsed} th={th}/></div>
            </div>
          </>
        )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
