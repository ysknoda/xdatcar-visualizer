// Compute lattice angle between two vectors in degrees
function vecAngleDeg(u, v) {
  const dot = u[0]*v[0]+u[1]*v[1]+u[2]*v[2];
  const lu  = Math.sqrt(u[0]*u[0]+u[1]*u[1]+u[2]*u[2]);
  const lv  = Math.sqrt(v[0]*v[0]+v[1]*v[1]+v[2]*v[2]);
  if (lu < 1e-10 || lv < 1e-10) return 90;
  return Math.acos(Math.max(-1, Math.min(1, dot/(lu*lv)))) * 180/Math.PI;
}

// ═══════════════════════════════════════════════════════════════
// StructureViewer internals, split into focused custom hooks.
//
// Each hook owns one independent side-effect concern that used to live
// inline in StructureViewer. Refs are created once in StructureViewer
// (the "owner" component) and passed down as plain arguments/objects —
// each hook mutates only the refs/state it's given, exactly reproducing
// the original inline behaviour. This is a pure internal reorganisation;
// no behaviour is intended to change.
// ═══════════════════════════════════════════════════════════════

// ── Theme sync: update renderer clear colour when the background theme changes ──
function useThemeSync(sceneRef, th) {
  useEffect(()=>{
    const sc=sceneRef.current; if(!sc) return;
    sc.renderer.setClearColor(th ? th.canvas : 0x0a1628, 1);
  },[th]);
}

// ── Projection sync: swap active camera (perspective/ortho) when projMode changes ──
function useProjectionSync(sceneRef, projMode) {
  useEffect(()=>{
    const sc=sceneRef.current; if(!sc) return;
    const fromCam = projMode==="perspective" ? sc.orthoCamera : sc._perspCamera;
    const toCam   = projMode==="perspective" ? sc._perspCamera : sc.orthoCamera;
    if (fromCam && toCam) {
      toCam.position.copy(fromCam.position);
      toCam.quaternion.copy(fromCam.quaternion);
      toCam.up.copy(fromCam.up);
      toCam.updateProjectionMatrix();
    }
    sc.camera = projMode==="perspective"
      ? sc._perspCamera : (sc.orthoCamera||sc._perspCamera);
  },[projMode]);
}

// ── Corner axis inset: dedicated small WebGLRenderer drawn into its own
// DOM canvas (mounted only when axisMode==="corner"), mirroring the main
// camera's orientation each tick. Owns cornerSyncRef (polled once per
// rAF tick by the main render loop) and cornerNormLatRef (this frame's
// normalised lattice, kept fresh by useFrameSync / the main rAF loop) —
// both are returned so other hooks can read/write them. ──
function useCornerAxisInset(axisMode, cornerCanvasRef, cornerScRef, sceneRef, frames, stepRef, parsed) {
  const cornerSyncRef     = useRef(null); // called each rAF tick from main render loop
  const cornerNormLatRef  = useRef(null);  // normalised lattice for corner arrows (updated in rAF)

  useEffect(() => {
    // When switching away from "corner" mode, tear down the inset renderer.
    if (axisMode !== "corner") {
      const csc = cornerScRef.current;
      if (csc) {
        disposeAxisArrows(csc.arrows);
        csc.renderer.dispose();
        cornerScRef.current = null;
      }
      cornerSyncRef.current = null;
      return;
    }

    // Wait one tick for React to mount the canvas element.
    // Guard: if axisMode changed again before the timeout fires, abort.
    let cancelled = false;
    const tid = setTimeout(() => {
      if (cancelled) return;
      const domCanvas = cornerCanvasRef.current;
      if (!domCanvas) return;

      const SIZE = 160;
      domCanvas.width  = SIZE;
      domCanvas.height = SIZE;

      const cr = new THREE.WebGLRenderer({ canvas: domCanvas, antialias: true, alpha: true });
      cr.setPixelRatio(window.devicePixelRatio || 1);
      cr.setSize(SIZE, SIZE, false);
      cr.setClearColor(0x000000, 0); // transparent background

      const cs = new THREE.Scene();
      cs.add(new THREE.AmbientLight(0xffffff, 0.55));
      const cdl = new THREE.DirectionalLight(0xffffff, 0.9);
      cdl.position.set(3, 4, 5); cs.add(cdl);

      const cc = new THREE.PerspectiveCamera(36, 1, 0.01, 100);
      cc.position.set(0, 0, 5);
      cc.lookAt(0, 0, 0);

      const cArrows = createAxisArrows(cs);
      // Initialise arrow orientations from current step lattice
      const initStepRef = stepRef ? stepRef.current : 0;
      const initLat = (frames[initStepRef] || frames[0] || {}).lattice;
      if (initLat) {
        const normLat = initLat.map(v => {
          const len = Math.sqrt(v[0]*v[0]+v[1]*v[1]+v[2]*v[2]) || 1;
          return [v[0]/len, v[1]/len, v[2]/len];
        });
        updateAxisArrows(cArrows, normLat);
      }

      cornerScRef.current = { renderer: cr, scene: cs, camera: cc, arrows: cArrows };

      // Register the per-frame sync function called by the main rAF loop.
      // It mirrors the main camera's view direction and re-renders the inset.
      cornerSyncRef.current = () => {
        const csc = cornerScRef.current;
        const sc  = sceneRef.current;
        if (!csc || !sc) return;

        // Mirror the main camera orientation exactly
        const dir = new THREE.Vector3();
        sc.camera.getWorldDirection(dir);
        csc.camera.position.copy(dir).negate().multiplyScalar(5);
        // Sync up vector so the corner inset rotates identically to the main view
        csc.camera.up.copy(sc.camera.up);
        csc.camera.lookAt(0, 0, 0);

        // Update corner arrows with current frame's normalised lattice (NPT support)
        if (cornerNormLatRef.current) {
          updateAxisArrows(csc.arrows, cornerNormLatRef.current);
        }

        csc.renderer.render(csc.scene, csc.camera);
      };
    }, 0);

    return () => {
      cancelled = true; // prevent the setTimeout callback from running
      clearTimeout(tid);
      const csc = cornerScRef.current;
      if (csc) {
        disposeAxisArrows(csc.arrows);
        // Use a try/catch: dispose can throw if context is already lost
        try { csc.renderer.dispose(); } catch(e) {}
        cornerScRef.current = null;
      }
      cornerSyncRef.current = null;
    };
  }, [axisMode, parsed]); // re-init when mode or dataset changes

  return { cornerSyncRef, cornerNormLatRef };
}

// ── Frame sync: re-render the Three.js scene whenever the step, bond rules,
// scale/margin sliders, display flags, or highlight/colour state change.
// During playback the rAF loop calls updateFrame directly for speed; this
// effect only handles manual step changes (slider, buttons) and settings
// changes so the view stays in sync without waiting on the next tick. ──
function useFrameSync(deps) {
  const {
    sceneRef, bondPoolRef, replicaPoolRef, bondCacheRef, polyPoolRef, mirrorPoolRef,
    bondRadiusRef, labelSpritesRef, pickedSetRef, highlightSetRef, coordHighlightMapRef,
    cornerNormLatRef, cornerScRef,
    step, frames, atomElements, bondRules, replicaMargin, opaqueMin, opaqueMax,
    coordRules, atomScale, polyRules, atomColors, labelVisible, bondsEnabled,
    axisMode, showCell, bondScale, highlightAtoms,
  } = deps;

  useEffect(() => {
    const sc=sceneRef.current, bp=bondPoolRef.current, rp=replicaPoolRef.current;
    if (!sc||!bp||!rp) return;
    const bnr = bondsEnabled
      ? bondCacheRef.current(step, frames[step], atomElements, bondRules, replicaMargin, opaqueMin, opaqueMax)
      : null;
    const coordMap = computeCoordHighlightMap(coordRules, frames[step], atomElements, bondRules);
    coordHighlightMapRef.current = coordMap;
    updateFrame(step, sc, frames, atomElements, atomScale, bnr, bp, rp, polyPoolRef.current, polyRules, bondRadiusRef.current, mirrorPoolRef.current, replicaMargin, opaqueMin, opaqueMax, atomColors, labelSpritesRef.current, labelVisible, pickedSetRef.current, highlightSetRef.current, coordMap);

    // Axis arrow visibility in main scene (overlay mode only)
    if (sc.axisArrows) {
      const vis = (axisMode === "overlay");
      sc.axisArrows.forEach(({shaft,head,label}) => {
        shaft.visible = vis; head.visible = vis; label.visible = vis;
      });
    }

    // Unit cell wireframe visibility
    if (sc.cellLine) sc.cellLine.visible = showCell;

    // Update corner inset normalised lattice vectors
    if (frames[step]) {
      const lat = frames[step].lattice;
      const normLat = lat.map(v => {
        const len = Math.sqrt(v[0]*v[0]+v[1]*v[1]+v[2]*v[2]) || 1;
        return [v[0]/len, v[1]/len, v[2]/len];
      });
      cornerNormLatRef.current = normLat; // keep ref in sync for rAF loop
      const csc = cornerScRef.current;
      if (csc) updateAxisArrows(csc.arrows, normLat);
    }
  }, [step, bondRules, polyRules, atomScale, bondScale, replicaMargin, frames, atomElements, bondsEnabled, axisMode, showCell, opaqueMin, opaqueMax, atomColors, labelVisible, highlightAtoms, coordRules]);
}

// ── Picking and measurement: click-to-pick handler, cumulative measurement
// table (distance/angle/dihedral), and emissive highlight application on
// atom + mirror meshes. Owns pickedSetRef (read by updateFrame every tick,
// via useThreeSceneInit/useFrameSync/useTriggerUpdate), returned so those
// hooks can use it. ──
function usePickingAndMeasurement(deps) {
  const {
    canvasRef, sceneRef, orbitRef, atomElementsRef, highlightModeRef, measureEnabledRef,
    highlightSetRef,
    highlightAtoms, setHighlightAtoms, measureEnabled, setMeasureHistory,
    frames, step, atomElements,
  } = deps;

  // ── Unified click handler ────────────────────────────────────────
  useEffect(() => {
    const canvas = canvasRef.current; if (!canvas) return;
    function onClick(e) {
      if (!highlightModeRef.current) return;
      // Suppress click-to-pick after an actual drag: compare against the
      // position recorded at mousedown (orb.downX/downY), not movementX/Y
      // (which only reflects the delta since the last mousemove).
      const orb = orbitRef.current;
      if (Math.abs(e.clientX-orb.downX) > 4 || Math.abs(e.clientY-orb.downY) > 4) return;
      const sc = sceneRef.current; if (!sc) return;
      const _ec={};
      const bl=atomElementsRef.current.map((el,i)=>{ _ec[el]=(_ec[el]||0)+1; return el+_ec[el]; });
      if (measureEnabledRef.current) {
        // Measure sub-mode: opaque atoms including mirror, max 4
        const hit=pickAtomExtended(e,canvas,sc.camera,sc.atomMeshes,sc,bl);
        if (!hit) return;
        const key=`${hit.ai},${hit.da},${hit.db},${hit.dc}`;
        setHighlightAtoms(prev=>{
          const idx=prev.findIndex(p=>`${p.ai},${p.da},${p.db},${p.dc}`===key);
          if(idx>=0) return prev.filter((_,i)=>i!==idx);
          return [...prev,hit].slice(-4);
        });
      } else {
        // Highlight-only: use the same pickAtomExtended as measure mode so that
        // opaque mirror atoms (fracImg outside [0,1) but inside opaqueMax) are
        // also selectable. No count limit applied.
        const hit=pickAtomExtended(e,canvas,sc.camera,sc.atomMeshes,sc,bl);
        if (!hit) return;
        const key2=`${hit.ai},${hit.da},${hit.db},${hit.dc}`;
        setHighlightAtoms(prev=>{
          const idx=prev.findIndex(p=>`${p.ai},${p.da},${p.db},${p.dc}`===key2);
          if(idx>=0) return prev.filter((_,i)=>i!==idx);
          return [...prev,hit]; // no .slice(-4): highlight-only has no limit
        });
      }
    }
    canvas.addEventListener("click",onClick);
    return ()=>canvas.removeEventListener("click",onClick);
  }, []);

  // Cumulative measurement table; pickedAtoms = [{ai,da,db,dc,fracWrap,cart,label}]
  useEffect(() => {
    const sc = sceneRef.current; if (!sc) return;
    const n = highlightAtoms.length;
    if (n === 0) { setMeasureHistory([]); return; }
    const pts = highlightAtoms.map(p => {
      if (p.da===0&&p.db===0&&p.dc===0&&sc.atomMeshes[p.ai]) {
        const m2=sc.atomMeshes[p.ai]; return [m2.position.x,m2.position.y,m2.position.z];
      }
      return p.cart;
    });
    const liveLat = frames[step] ? frames[step].lattice : null;
    const lines = highlightAtoms.map((p, i) => {
      let fracLive = p.fracWrap; let daLive=p.da, dbLive=p.db, dcLive=p.dc;
      if (p.da===0&&p.db===0&&p.dc===0&&sc.atomMeshes[p.ai]&&liveLat) {
        const m2=sc.atomMeshes[p.ai];
        const rawFrac = cartToFrac([m2.position.x,m2.position.y,m2.position.z], liveLat);
        daLive=Math.floor(rawFrac[0]); dbLive=Math.floor(rawFrac[1]); dcLive=Math.floor(rawFrac[2]);
        fracLive = rawFrac.map(v=>v-Math.floor(v));
      }
      const coordStr = fracLive ? `(${fracLive[0].toFixed(4)}, ${fracLive[1].toFixed(4)}, ${fracLive[2].toFixed(4)})` : "";
      const cellStr = (daLive===0&&dbLive===0&&dcLive===0) ? "(0,0,0)" : `(${daLive},${dbLive},${dcLive})`;
      return {
        label: p.label, coord: coordStr, cell: cellStr,
        dist:     i>=1 ? measureDistance(pts[i-1],pts[i]).toFixed(4) : null,
        angle:    i>=2 ? measureAngle(pts[i-2],pts[i-1],pts[i]).toFixed(3) : null,
        dihedral: i>=3 ? measureDihedral(pts[i-3],pts[i-2],pts[i-1],pts[i]).toFixed(3) : null,
      };
    });
    setMeasureHistory(lines);
  }, [highlightAtoms, step, atomElements, measureEnabled]);

  // Highlight picked atom meshes — stored in ref so updateFrame can apply it
  // without being overwritten each animation frame
  const pickedSetRef = useRef(new Set());
  useEffect(() => {
    // Build key sets for fast lookup
    // Central atoms: da===0&&db===0&&dc===0
    const centralAiSet = new Set(
      highlightAtoms.filter(p=>p&&p.da===0&&p.db===0&&p.dc===0).map(p=>p.ai)
    );
    // Mirror atoms: keyed by "ai,da,db,dc"
    const mirrorKeySet = new Set(
      highlightAtoms.filter(p=>p&&(p.da!==0||p.db!==0||p.dc!==0))
                    .map(p=>`${p.ai},${p.da},${p.db},${p.dc}`)
    );

    pickedSetRef.current    = centralAiSet;
    highlightSetRef.current = centralAiSet;

    const sc = sceneRef.current; if (!sc) return;

    // Apply emissive to central atom meshes
    sc.atomMeshes.forEach((m, ai) => {
      // ShaderMaterial has no emissive; highlight is handled via baseColor
      // lerp in updateFrame. Just ensure needsUpdate for non-shader fallback.
      if (!m.material.uniforms && m.material.emissive) {
        m.material.emissive.set(centralAiSet.has(ai) ? 0xffaa00 : 0x000000);
        m.material.emissiveIntensity = centralAiSet.has(ai) ? 0.70 : 0;
      }
    });

    // Apply emissive to mirror atom meshes
    if (sc.mirrorPool && sc.mirrorPool.pools && sc._displayAtoms) {
      Object.values(sc.mirrorPool.pools).forEach(pool => {
        pool.forEach(m => {
          if (!m.visible) return;
          const dIdx = m._displayAtomIdx;
          if (dIdx === undefined) return;
          const da = sc._displayAtoms[dIdx];
          if (!da) return;
          const key = `${da.ai},${da.da},${da.db},${da.dc}`;
          const isHL = mirrorKeySet.has(key);
          m.material.emissive.set(isHL ? 0xffaa00 : 0x000000);
          m.material.emissiveIntensity = isHL ? 0.70 : 0;
        });
      });
    }

    // Guide line only in measure sub-mode
    if (measureEnabled && highlightAtoms.length >= 2) {
      const posObjs = highlightAtoms.map(p => {
        if (p&&p.da===0&&p.db===0&&p.dc===0&&sc.atomMeshes[p.ai]) return sc.atomMeshes[p.ai];
        return { position:{x:p.cart[0],y:p.cart[1],z:p.cart[2]} };
      });
      updatePickGuideFromPositions(sc.scene, posObjs);
    } else {
      updatePickGuideFromPositions(sc.scene, []);
    }
  }, [highlightAtoms, measureEnabled]);

  return { pickedSetRef };
}

// ── Manual orbit controls (quaternion-based, gimbal-lock-free). Reads/writes
// orbitRef (owned by StructureViewer) and the active camera off sceneRef. ──
function useOrbitControls(canvasRef, orbitRef, sceneRef, projModeRef) {
  useEffect(() => {
    const canvas = canvasRef.current; if (!canvas) return;
    const orb = orbitRef.current;

    // Initialise quaternion to identity on first use
    if (!orb.quat) orb.quat = new THREE.Quaternion();

    // Reusable THREE objects (allocated once, never GC'd during interaction)
    const _camPos  = new THREE.Vector3();
    const _right   = new THREE.Vector3();
    const _up      = new THREE.Vector3();
    const _axis    = new THREE.Vector3();
    const _dq      = new THREE.Quaternion();
    const _offset  = new THREE.Vector3();

    function applyOrbit() {
      const sc2 = sceneRef.current;
      if (!sc2) return;
      const ctr = sc2.ctr || [0, 0, 0];

      // Choose active camera based on current projection mode
      const isPerspective = projModeRef.current === "perspective";
      const cam = isPerspective ? sc2.camera : sc2.orthoCamera;
      if (!cam) return;

      // Current offset from target: radius along the stored quaternion's -Z axis
      _offset.set(0, 0, orb.radius);
      _offset.applyQuaternion(orb.quat);

      // Pan offset: camera right and up vectors from current orientation
      _right.set(1, 0, 0).applyQuaternion(orb.quat);
      _up.set(0, 1, 0).applyQuaternion(orb.quat);

      const tx = ctr[0] + _right.x * orb.panX + _up.x * orb.panY;
      const ty = ctr[1] + _right.y * orb.panX + _up.y * orb.panY;
      const tz = ctr[2] + _right.z * orb.panX + _up.z * orb.panY;

      cam.position.set(tx + _offset.x, ty + _offset.y, tz + _offset.z);
      cam.lookAt(tx, ty, tz);
      cam.up.set(0, 1, 0).applyQuaternion(orb.quat);

      // For ortho: keep frustum size proportional to radius (zoom via frustum, not distance)
      if (!isPerspective) {
        const canvas2 = canvasRef.current;
        const aspect2 = canvas2 ? canvas2.clientWidth/canvas2.clientHeight : 1;
        const fh = orb.radius * Math.tan(45 * Math.PI/180 / 2);
        cam.left=-fh*aspect2; cam.right=fh*aspect2; cam.top=fh; cam.bottom=-fh;
        cam.updateProjectionMatrix();
      }
    }

    function rotate(dx, dy) {
      // Horizontal drag  → rotate around the camera's current UP axis
      // Vertical drag    → rotate around the camera's current RIGHT axis
      const SPEED = 0.005;
      _right.set(1, 0, 0).applyQuaternion(orb.quat);
      _up.set(0, 1, 0).applyQuaternion(orb.quat);

      // Azimuth: rotate around current up
      _dq.setFromAxisAngle(_up, -dx * SPEED);
      orb.quat.premultiply(_dq);

      // Elevation: rotate around current right
      _dq.setFromAxisAngle(_right, -dy * SPEED);
      orb.quat.premultiply(_dq);

      // Normalise to prevent floating-point drift
      orb.quat.normalize();
    }

    const onDn  = e => { orb.isDown=true; orb.isPan=e.button===2||e.ctrlKey; orb.lastX=e.clientX; orb.lastY=e.clientY; orb.downX=e.clientX; orb.downY=e.clientY; };
    const onUp  = () => orb.isDown=false;
    const onMv  = e => {
      if (!orb.isDown) return;
      const dx=e.clientX-orb.lastX, dy=e.clientY-orb.lastY;
      orb.lastX=e.clientX; orb.lastY=e.clientY;
      if (orb.isPan) {
        orb.panX -= dx * orb.radius * 0.002;
        orb.panY += dy * orb.radius * 0.002;
      } else {
        rotate(dx, dy);
      }
      applyOrbit();
    };
    const onWh  = e => { e.preventDefault(); orb.radius=Math.max(0.5,orb.radius*(1+e.deltaY*0.001)); applyOrbit(); };
    const onCx  = e => e.preventDefault();

    let ld = 0;
    const onTSt = e => {
      if (e.touches.length===1) { orb.isDown=true; orb.isPan=false; orb.lastX=e.touches[0].clientX; orb.lastY=e.touches[0].clientY; }
      else if (e.touches.length===2) { const dx=e.touches[0].clientX-e.touches[1].clientX,dy=e.touches[0].clientY-e.touches[1].clientY; ld=Math.sqrt(dx*dx+dy*dy); }
    };
    const onTMv = e => {
      e.preventDefault();
      if (e.touches.length===1 && orb.isDown) {
        const dx=e.touches[0].clientX-orb.lastX, dy=e.touches[0].clientY-orb.lastY;
        orb.lastX=e.touches[0].clientX; orb.lastY=e.touches[0].clientY;
        rotate(dx, dy); applyOrbit();
      } else if (e.touches.length===2) {
        const dx=e.touches[0].clientX-e.touches[1].clientX,dy=e.touches[0].clientY-e.touches[1].clientY,d=Math.sqrt(dx*dx+dy*dy);
        orb.radius=Math.max(0.5,orb.radius*(ld/d)); ld=d; applyOrbit();
      }
    };
    const onTEd = () => orb.isDown=false;

    // mousemove/mouseup are registered on window (not canvas) so that releasing
    // the button after the cursor has left the canvas still clears orb.isDown —
    // otherwise the drag state sticks and the next mousemove over the canvas
    // causes a sudden camera jump.
    canvas.addEventListener("mousedown",   onDn);
    window.addEventListener("mousemove",   onMv);
    window.addEventListener("mouseup",     onUp);
    canvas.addEventListener("wheel",       onWh, {passive:false});
    canvas.addEventListener("contextmenu", onCx);
    canvas.addEventListener("touchstart",  onTSt,{passive:false});
    canvas.addEventListener("touchmove",   onTMv,{passive:false});
    canvas.addEventListener("touchend",    onTEd);
    return () => {
      canvas.removeEventListener("mousedown",   onDn);
      window.removeEventListener("mousemove",   onMv);
      window.removeEventListener("mouseup",     onUp);
      canvas.removeEventListener("wheel",       onWh);
      canvas.removeEventListener("contextmenu", onCx);
      canvas.removeEventListener("touchstart",  onTSt);
      canvas.removeEventListener("touchmove",   onTMv);
      canvas.removeEventListener("touchend",    onTEd);
    };
  }, []);
}

// ── Three.js scene initialisation + main render loop. Owns the
// WebGLRenderer/Scene/Camera lifecycle and the requestAnimationFrame loop
// that advances playback and re-renders every tick. Runs once per `parsed`
// (i.e. once per loaded file) — heavy one-time setup plus the per-frame hot
// path, which stays allocation-free by reading everything through refs. ──
function useThreeSceneInit(deps) {
  const {
    canvasRef, sceneRef, bondPoolRef, replicaPoolRef, polyPoolRef, mirrorPoolRef,
    labelSpritesRef, orbitRef, stepRef, playingRef, fpsRef, frameAccumRef,
    bondCacheRef, atomElementsRef, bondRulesRef, replicaMarginRef,
    opaqueMinRef, opaqueMaxRef, coordRulesRef, coordHighlightMapRef,
    atomScaleRef, polyRulesRef, bondRadiusRef, replicaMarginRenderRef,
    atomColorsRef, labelVisibleRef, pickedSetRef, highlightSetRef,
    setStepRef, projModeRef, cornerSyncRef, cornerNormLatRef,
    frames, atomElements, th, parsed,
  } = deps;

  useEffect(() => {
    const canvas = canvasRef.current; if (!canvas) return;
    const W = canvas.clientWidth||800, H = canvas.clientHeight||480;
    const renderer = new THREE.WebGLRenderer({ canvas, antialias:true });
    renderer.setPixelRatio(window.devicePixelRatio||1);
    renderer.setSize(W,H,false);
    renderer.setClearColor(th ? th.canvas : 0x0a1628, 1);
    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(45,W/H,0.01,1000);
    const f0=frames[0], lat0=f0.lattice;
    const maxDim=Math.max(f0.a,f0.b,f0.c), startR=maxDim*2.2;
    const orb=orbitRef.current; orb.radius=startR;
    // Orthographic camera (same near/far, frustum size set via orb.radius)
    const frustumHalf = startR * Math.tan(45*Math.PI/180/2);
    const orthoCamera = new THREE.OrthographicCamera(
      -frustumHalf*(W/H), frustumHalf*(W/H), frustumHalf, -frustumHalf, 0.01, 2000
    );
    // Rotation center = fractional (0.5, 0.5, 0.5) = Cartesian center of unit cell.
    // Stored as a plain array in sceneRef and updated each frame for variable-cell runs.
    const ctr = fracToCart([0.5,0.5,0.5], lat0);

    // Seed the orbit quaternion to reproduce the initial theta/phi viewing angle.
    // theta=PI*0.25 (azimuth), phi=PI*0.30 (elevation from Y-up).
    // We compose: first rotate around Y by theta, then around local X by (phi - PI/2).
    if (!orb.quat) orb.quat = new THREE.Quaternion();
    const _initQ1 = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0,1,0), Math.PI*0.25);
    const _initQ2 = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1,0,0), Math.PI*0.30 - Math.PI*0.5);
    orb.quat.copy(_initQ1).multiply(_initQ2).normalize();

    // Place camera using the seeded quaternion
    const _initOff = new THREE.Vector3(0, 0, startR).applyQuaternion(orb.quat);
    camera.position.set(ctr[0]+_initOff.x, ctr[1]+_initOff.y, ctr[2]+_initOff.z);
    camera.up.set(0,1,0).applyQuaternion(orb.quat);
    camera.lookAt(ctr[0],ctr[1],ctr[2]);

    // Atom shading handled by custom ShaderMaterial (N·V view-space).
    // AmbientLight here covers bonds, polyhedra, and other non-shader objects.
    scene.add(new THREE.AmbientLight(0xffffff, 1.0));

    // Atom meshes (shared geometry per element)
    const geomCache={}, matCache={};
    [...new Set(atomElements)].forEach(el => {
      geomCache[el] = new THREE.SphereGeometry(1,20,14);
      // Base material per element — cloned per atom below so each mesh
      // can independently change opacity/emissive without affecting siblings.
      matCache[el] = makeAtomMaterial(atomColor(el));
    });
    // Clone material for EACH atom so opacity and emissive are independent.
    const atomMeshes = atomElements.map(el => {
      const m=new THREE.Mesh(geomCache[el], matCache[el].clone());
      const r=atomRadius(el); m.scale.set(r,r,r); scene.add(m); return m;
    });

    // Unit cell wireframe
    const cellGeo=new THREE.BufferGeometry();
    const cellMat=new THREE.LineBasicMaterial({color:0x60a5fa,linewidth:1.5,opacity:0.8,transparent:true});
    cellGeo.setAttribute("position",new THREE.BufferAttribute(cellEdgePositions(lat0),3));
    const cellLine=new THREE.LineSegments(cellGeo,cellMat); scene.add(cellLine);

    // Bond pool
    const bondPool    = createBondPool(scene);
    // Replica pool (shares geomCache with main atoms)
    const replicaPool = createReplicaPool(scene, geomCache);
    // Polyhedron pool
    const polyPool = createPolyPool(scene);
    // Boundary-mirror pool (atoms near cell face mirrored to opposite face)
    const mirrorPool = createMirrorPool(scene, geomCache);
    bondPoolRef.current    = bondPool;
    replicaPoolRef.current = replicaPool;
    polyPoolRef.current    = polyPool;
    mirrorPoolRef.current  = mirrorPool;

    // Lattice axis arrows (a=red, b=green, c=blue)
    const axisArrows = createAxisArrows(scene);
    updateAxisArrows(axisArrows, lat0);

    // Build default atom labels: "Si1","Si2"... per element, in XDATCARorder
    const _elCount = {};
    const defaultLabels = atomElements.map(el => {
      _elCount[el] = (_elCount[el]||0)+1;
      return el+_elCount[el];
    });
    const labelSprites = createAtomLabelSprites(scene, atomElements, defaultLabels);
    labelSpritesRef.current = labelSprites;

    sceneRef.current = { scene, camera, _perspCamera: camera, orthoCamera, renderer, atomMeshes, cellLine, geomCache, matCache, ctr, axisArrows };
    sceneRef.current.mirrorPool = mirrorPool; // for picker access
    updateFrame(0, sceneRef.current, frames, atomElements, 1.0, null, bondPool, replicaPool, polyPool, [], BOND_RADIUS, mirrorPool, 0.2, [0,0,0],[1,1,1], null, labelSprites, null, new Set(), new Set(), new Map());

    // Animation state tracked via refs so the rAF closure always sees
    // the latest values without re-registering the loop.
    let rafId;
    let lastTickTime = performance.now();
    // frameAccum lives in frameAccumRef so Play/Pause can reset it from outside the closure.

    function rl(now) {
      rafId = requestAnimationFrame(rl);

      // ── Advance animation step ───────────────────────────────
      if (playingRef.current && frames.length > 1) {
        const elapsed = now - lastTickTime;
        frameAccumRef.current += elapsed;
        const interval = 1000 / fpsRef.current; // ms per frame
        if (frameAccumRef.current >= interval) {
          // How many steps to advance (handles very high FPS across slow frames)
          const steps = Math.floor(frameAccumRef.current / interval);
          frameAccumRef.current -= steps * interval;
          const nextStep = (stepRef.current + steps) % frames.length;
          stepRef.current = nextStep;

          // Update Three.js scene directly — no React re-render needed
          const sc  = sceneRef.current;
          const bp  = bondPoolRef.current;
          const rp  = replicaPoolRef.current;
          if (sc && bp && rp) {
            const br = bondRulesRef.current;
            const bondsOn = br.some(r => r.enabled);
            const bnr = bondsOn
              ? bondCacheRef.current(nextStep, frames[nextStep], atomElementsRef.current, br, replicaMarginRef.current, opaqueMinRef.current, opaqueMaxRef.current)
              : null;
            // Recompute coordination-based highlight map for this frame
            // (uses the accurate per-atom counter, independent of bondsOn state)
            const coordMap = computeCoordHighlightMap(coordRulesRef.current, frames[nextStep], atomElementsRef.current, br);
            coordHighlightMapRef.current = coordMap;
            updateFrame(nextStep, sc, frames, atomElementsRef.current,
                        atomScaleRef.current, bnr, bp, rp,
                        polyPoolRef.current, polyRulesRef.current, bondRadiusRef.current,
                        mirrorPoolRef.current, replicaMarginRenderRef.current,
                        opaqueMinRef.current, opaqueMaxRef.current,
                        atomColorsRef.current, labelSpritesRef.current, labelVisibleRef.current,
                        pickedSetRef.current, highlightSetRef.current, coordMap);
            // Axis arrow visibility and cell visibility are set once on toggle,
            // so no need to re-apply them here every frame.
          }

          // Sync React state for the slider and step counter (cheap — batched by React)
          setStepRef.current(nextStep);

          // Update corner normalised lattice ref for the new step (NPT support)
          if (frames[nextStep]) {
            const lat = frames[nextStep].lattice;
            cornerNormLatRef.current = lat.map(v => {
              const len = Math.sqrt(v[0]*v[0]+v[1]*v[1]+v[2]*v[2]) || 1;
              return [v[0]/len, v[1]/len, v[2]/len];
            });
          }
        }
      }
      lastTickTime = now;

      // ── Render ──────────────────────────────────────────────
      // Render with the active camera (perspective or ortho)
      const _activeCam = projModeRef.current==="perspective" ? camera : (sceneRef.current?.orthoCamera||camera);
      renderer.render(scene, _activeCam);
      if (cornerSyncRef.current) cornerSyncRef.current();
    }
    requestAnimationFrame(rl);

    const ro=new ResizeObserver(()=>{
      const w=canvas.clientWidth,h=canvas.clientHeight;
      if(w>0&&h>0){
        renderer.setSize(w,h,false);
        camera.aspect=w/h; camera.updateProjectionMatrix();
        // Update ortho frustum on resize
        const sc2=sceneRef.current;
        if(sc2&&sc2.orthoCamera){
          const fh=orb.radius*Math.tan(45*Math.PI/180/2);
          sc2.orthoCamera.left=-fh*(w/h); sc2.orthoCamera.right=fh*(w/h);
          sc2.orthoCamera.top=fh; sc2.orthoCamera.bottom=-fh;
          sc2.orthoCamera.updateProjectionMatrix();
        }
      }
    }); ro.observe(canvas);

    return () => {
      cancelAnimationFrame(rafId); ro.disconnect(); renderer.dispose();
      Object.values(geomCache).forEach(g=>g.dispose());
      Object.values(matCache).forEach(m=>m.dispose());
      atomMeshes.forEach(m=>{ if (m.material) m.material.dispose(); });
      cellGeo.dispose(); cellMat.dispose();
      bondPool.reset(); replicaPool.reset(); polyPool.reset(); mirrorPool.reset();
      if (labelSpritesRef.current) disposeAtomLabelSprites(labelSpritesRef.current);
      // Remove pick guideline
      const sc2 = sceneRef.current;
      if (sc2 && sc2.scene && sc2.scene._pickGuide) {
        const pg = sc2.scene._pickGuide;
        if (pg._isGroup) {
          pg.children.forEach(c => { c.geometry.dispose(); c.material.dispose(); });
        } else if (pg.geometry) {
          pg.geometry.dispose();
        }
        sc2.scene.remove(pg);
      }
      if (axisArrows) disposeAxisArrows(axisArrows);
    };
  }, [parsed]);
}

// ── Unified Highlight / Measure panel (shown when highlightMode is on) ──
// Toggles between plain highlight (no limit) and measure sub-mode (max 4
// picks, computes cumulative distance/angle/dihedral), plus coordination-
// number highlight rules. Extracted verbatim from StructureViewer's JSX.
function HighlightMeasurePanel({
  th, measureEnabled, setMeasureEnabled, highlightAtoms, setHighlightAtoms,
  measureHistory, setMeasureHistory, elementSymbols, sceneRef, atomElements,
  coordRules, setCoordRules, bondsEnabled,
}) {
  return (
    <div style={{background:th?th.panelAlt:"#0f172a",border:"1px solid "+(th?th.border:"#1e3a5f"),
                 borderRadius:8,padding:"10px 16px",marginTop:8}}>
      <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:8,flexWrap:"wrap"}}>
        <span style={{color:"#ffaa00",fontSize:12,fontWeight:600}}>
          Highlight{measureEnabled?" + Measure":""}
        </span>
        <div style={{display:"flex",border:"1px solid "+(th?th.borderMid:"#334155"),borderRadius:5,overflow:"hidden"}}>
          {[["Highlight only",false],["+ Measure (max 4)",true]].map(([lbl,val])=>(
            <button key={String(val)}
              onClick={()=>{ setMeasureEnabled(val); setHighlightAtoms([]); setMeasureHistory([]); }}
              style={{padding:"3px 10px",fontSize:11,cursor:"pointer",border:"none",
                background:measureEnabled===val?"#3a2800":(th?th.inputBg:"#1e293b"),
                color:measureEnabled===val?"#ffaa00":(th?th.muted:"#94a3b8"),
                fontWeight:measureEnabled===val?600:400}}>
              {lbl}
            </button>
          ))}
        </div>
        <span style={{color:th?th.muted:"#64748b",fontSize:10}}>
          {measureEnabled
            ? "Click opaque atoms (max 4) | 2->dist | 3->angle | 4->dihedral"
            : "Click any atom to toggle highlight | No limit"}
        </span>
      </div>
      {highlightAtoms.length>0&&(
        <div style={{display:"flex",flexWrap:"wrap",gap:4,marginBottom:6}}>
          {highlightAtoms.map((p,idx)=>(
            <span key={idx} style={{background:"#ffaa0022",border:"1px solid #ffaa00",
              borderRadius:4,padding:"1px 7px",fontSize:11,color:"#ffaa00",cursor:"pointer"}}
              onClick={()=>setHighlightAtoms(prev=>prev.filter((_,i)=>i!==idx))}>
              {p.label||String(p.ai)} ✕
            </span>
          ))}
        </div>
      )}
      {measureEnabled && measureHistory.length>0 && (
        <div style={{overflowX:"auto",marginBottom:6}}>
          <table style={{borderCollapse:"collapse",width:"100%",fontSize:11}}>
            <thead><tr>{["#","Label","Frac coord","Cell index","Dist (Å)","Angle (°)","Dihedral (°)"].map(h=>(
              <th key={h} style={{textAlign:"left",padding:"2px 8px 4px 0",
                color:th?th.muted:"#64748b",fontWeight:600,
                borderBottom:"1px solid "+(th?th.border:"#1e3a5f"),whiteSpace:"nowrap"}}>{h}</th>
            ))}</tr></thead>
            <tbody>{measureHistory.map((row,i)=>(
              <tr key={i} style={{borderBottom:"1px solid "+(th?th.border+"33":"#1e3a5f33")}}>
                <td style={{padding:"3px 8px 3px 0",color:th?th.muted:"#64748b"}}>{i+1}</td>
                <td style={{padding:"3px 8px 3px 0",color:"#fbbf24",fontWeight:700}}>{row.label}</td>
                <td style={{padding:"3px 8px 3px 0",color:th?th.text:"#e2e8f0",fontFamily:"monospace",fontSize:10}}>{row.coord}</td>
                <td style={{padding:"3px 8px 3px 0",color:"#a78bfa",fontFamily:"monospace"}}>{row.cell}</td>
                <td style={{padding:"3px 8px 3px 0",color:"#60a5fa"}}>{row.dist??"-"}</td>
                <td style={{padding:"3px 8px 3px 0",color:"#34d399"}}>{row.angle??"-"}</td>
                <td style={{padding:"3px 8px 3px 0",color:"#f87171"}}>{row.dihedral??"-"}</td>
              </tr>
            ))}</tbody>
          </table>
        </div>
      )}
      <div style={{display:"flex",gap:8}}>
        <button onClick={()=>{ setHighlightAtoms([]); setMeasureHistory([]); }} style={sBtn("#7f1d1d")}>Clear all</button>
        {measureEnabled&&measureHistory.length>0&&(
          <button onClick={()=>{
            const rows=measureHistory.map((row,i)=>({idx:i+1,...row}));
            downloadTextFile("measurements.csv","text/csv",toCSV(rows,[
              {key:"idx",label:"#"},{key:"label",label:"Label"},{key:"coord",label:"Frac coord"},
              {key:"cell",label:"Cell index"},{key:"dist",label:"Dist (A)"},
              {key:"angle",label:"Angle (deg)"},{key:"dihedral",label:"Dihedral (deg)"},
            ]));
          }} style={sBtn("#1e3a5f")}>Export CSV</button>
        )}
        {!measureEnabled&&(
          <button onClick={()=>{
            const sc=sceneRef.current; const _ec={};
            const bl=atomElements.map((el,i)=>{_ec[el]=(_ec[el]||0)+1;return el+_ec[el];});
            setHighlightAtoms(atomElements.map((el,ai)=>{
              const frac=sc&&sc._lastFrame?sc._lastFrame.positions[ai]:[0,0,0];
              const mp=sc?sc.atomMeshes[ai].position:{x:0,y:0,z:0};
              return {ai,da:0,db:0,dc:0,fracWrap:frac,cart:[mp.x,mp.y,mp.z],label:bl[ai]};
            }));
          }} style={sBtn("#1e3a5f")}>Select all</button>
        )}
      </div>

      {/* Coordination-number based highlight rules (Highlight-only sub-mode) */}
      {!measureEnabled && (
        <CoordHighlightRules
          elementSymbols={elementSymbols}
          coordRules={coordRules}
          setCoordRules={setCoordRules}
          bondsEnabled={bondsEnabled}
          th={th}
        />
      )}
    </div>
  );
}

function StructureViewer({ parsed, th }) {
  const { frames, atomElements, elementSymbols, isVariableCell } = parsed;
  const canvasRef   = useRef(null);
  const sceneRef    = useRef(null);
  const bondPoolRef    = useRef(null);
  const replicaPoolRef = useRef(null);
  // Lazily-initialised single-slot bond cache shared by all three call sites
  // below (rAF loop, step/settings-sync effect, triggerUpdateRef), so that
  // repeat calls for the same frame+settings within one update don't redo
  // the O(N) neighbour search.
  const bondCacheRef = useRef(null);
  if (!bondCacheRef.current) bondCacheRef.current = makeBondCache();
  const stepRef         = useRef(0);
  // Quaternion-based orbit: stores the accumulated rotation as a THREE.Quaternion.
  // This avoids gimbal lock and allows free rotation in all directions.
  // Initialised lazily in the orbit useEffect once THREE is available.
  const orbitRef = useRef({
    isDown: false, isPan: false, lastX: 0, lastY: 0,
    downX: 0, downY: 0, // position at mousedown; used to measure total drag distance for click suppression
    radius: 0, panX: 0, panY: 0,
    quat: null,   // THREE.Quaternion — initialised in useEffect
  });
  const cornerCanvasRef = useRef(null);
  const cornerScRef     = useRef(null);
  // Refs that the rAF loop reads directly (avoids stale closures without re-registering)
  const playingRef       = useRef(false);
  const fpsRef           = useRef(10);
  const atomScaleRef     = useRef(1.0);
  const bondRulesRef     = useRef([]);
  const replicaMarginRef = useRef(0.2);
  const atomElementsRef  = useRef([]);
  const setStepRef       = useRef(null); // set in render body
  const frameAccumRef    = useRef(0);    // rAF accumulated time; reset on resume

  const [step,      setStep]      = useState(0);
  const [playing,   setPlaying]   = useState(false);
  const recording = useRecording(sceneRef, step, frames, playingRef, setPlaying);
  const [showRecordingPanel, setShowRecordingPanel] = useState(false);
  const [fps,       setFps]       = useState(10);
  const [atomScale,  setAtomScale]  = useState(1.0);
  const [bondScale,  setBondScale]  = useState(1.0); // multiplier on BOND_RADIUS
  const bondRadiusRef   = useRef(BOND_RADIUS);
  const mirrorPoolRef   = useRef(null);
  const replicaMarginRenderRef = useRef(0.2); // for updateFrame (not to confuse with replicaMarginRef for bonds)
  const triggerUpdateRef = useRef(null); // direct scene update without waiting for useEffect
  const [showBondPanel,  setShowBondPanel]  = useState(false);
  const [bondRules, setBondRules] = useState(() => buildDefaultBondRules(elementSymbols));
  const [replicaMargin, setReplicaMargin] = useState(0.2); // fractional coord margin
  // "off" | "overlay" | "corner"
  const [axisMode,  setAxisMode]  = useState("off");
  const [showCell,   setShowCell]   = useState(true);
  const [projMode,   setProjMode]   = useState("orthographic"); // "perspective" | "orthographic"
  const projModeRef = useRef("orthographic");
  const [polyRules, setPolyRules] = useState(() => buildDefaultPolyRules(elementSymbols));
  const [showPolyPanel, setShowPolyPanel] = useState(false);
  const polyPoolRef = useRef(null);
  const polyRulesRef = useRef([]);
  const bondsEnabled = bondRules.some(r => r.enabled);

  // (1) Opaque display region [minF, maxF] per axis
  const [opaqueMin, setOpaqueMin] = useState([0, 0, 0]);
  const [opaqueMax, setOpaqueMax] = useState([1, 1, 1]);
  const opaqueMinRef = useRef([0,0,0]);
  const opaqueMaxRef = useRef([1,1,1]);
  const [showOpaquePanel, setShowOpaquePanel] = useState(false);

  // (2) Atom labels
  const labelSpritesRef  = useRef(null);
  // labelVisible: array of bool per atom; null = all hidden
  const [labelVisible, setLabelVisible] = useState(() => new Array(atomElements.length).fill(false));
  const labelVisibleRef  = useRef(null);
  const [showLabelPanel, setShowLabelPanel] = useState(false);

  // (3) Per-atom custom colours: array of hex string | null
  const [atomColors, setAtomColors] = useState(() => new Array(atomElements.length).fill(null));
  const atomColorsRef  = useRef(null);
  const [showColorPanel, setShowColorPanel] = useState(false);

  // (4) Atom picker / measurement
  // ── Unified Highlight/Measure state ─────────────────────────
  const [measureHistory,  setMeasureHistory]  = useState([]);
  const [highlightMode,   setHighlightMode]   = useState(false);
  const [measureEnabled,  setMeasureEnabled]  = useState(false);
  const [highlightAtoms,  setHighlightAtoms]  = useState([]);
  const highlightModeRef   = useRef(false);
  const measureEnabledRef  = useRef(false);
  const highlightSetRef    = useRef(new Set());
  const highlightAtomsRef  = useRef([]);
  // Coordination-based highlight rules
  const [coordRules, setCoordRules] = useState([]); // [{key,centerEl,targetEl,coordNum,color,enabled}]
  const coordRulesRef = useRef([]);
  const coordHighlightMapRef = useRef(new Map()); // ai -> hexColor, from coordRules
  const displayAtomsRef    = useRef([]);
  // Legacy compat refs
  const pickedAtomsRef  = useRef([]);
  const pickModeRef     = useRef(false);

  // pickedSetRef is owned by usePickingAndMeasurement but read every rAF
  // tick by useThreeSceneInit/useFrameSync below, so it must be resolved
  // before those hooks are called.
  const { pickedSetRef } = usePickingAndMeasurement({
    canvasRef, sceneRef, orbitRef, atomElementsRef, highlightModeRef, measureEnabledRef,
    highlightSetRef,
    highlightAtoms, setHighlightAtoms, measureEnabled, setMeasureHistory,
    frames, step, atomElements,
  });

  // cornerSyncRef/cornerNormLatRef are owned by useCornerAxisInset but read
  // (and, for cornerNormLatRef, also written) by useThreeSceneInit's rAF
  // loop below, so this hook must run first to hand back the ref objects.
  const { cornerSyncRef, cornerNormLatRef } = useCornerAxisInset(
    axisMode, cornerCanvasRef, cornerScRef, sceneRef, frames, stepRef, parsed
  );

  useThreeSceneInit({
    canvasRef, sceneRef, bondPoolRef, replicaPoolRef, polyPoolRef, mirrorPoolRef,
    labelSpritesRef, orbitRef, stepRef, playingRef, fpsRef, frameAccumRef,
    bondCacheRef, atomElementsRef, bondRulesRef, replicaMarginRef,
    opaqueMinRef, opaqueMaxRef, coordRulesRef, coordHighlightMapRef,
    atomScaleRef, polyRulesRef, bondRadiusRef, replicaMarginRenderRef,
    atomColorsRef, labelVisibleRef, pickedSetRef, highlightSetRef,
    setStepRef, projModeRef, cornerSyncRef, cornerNormLatRef,
    frames, atomElements, th, parsed,
  });

  // ── Update corner arrows when lattice changes (variable cell) ─
  // Piggyback on the main frame update effect (see below).

  useThemeSync(sceneRef, th);
  useProjectionSync(sceneRef, projMode);

  useFrameSync({
    sceneRef, bondPoolRef, replicaPoolRef, bondCacheRef, polyPoolRef, mirrorPoolRef,
    bondRadiusRef, labelSpritesRef, pickedSetRef, highlightSetRef, coordHighlightMapRef,
    cornerNormLatRef, cornerScRef,
    step, frames, atomElements, bondRules, replicaMargin, opaqueMin, opaqueMax,
    coordRules, atomScale, polyRules, atomColors, labelVisible, bondsEnabled,
    axisMode, showCell, bondScale, highlightAtoms,
  });

  // Animation is driven by the rAF loop directly (see render loop above).
  // No setInterval needed — step advances are computed from elapsed time.

  useOrbitControls(canvasRef, orbitRef, sceneRef, projModeRef);

  // Keep rAF-readable refs in sync with current React state/props
  playingRef.current       = playing;
  fpsRef.current           = fps;
  atomScaleRef.current     = atomScale;
  bondRulesRef.current     = bondRules;
  replicaMarginRef.current = replicaMargin;
  atomElementsRef.current  = atomElements;
  setStepRef.current       = setStep;
  polyRulesRef.current     = polyRules;
  bondRadiusRef.current          = BOND_RADIUS * bondScale;
  replicaMarginRenderRef.current = replicaMargin;
  opaqueMinRef.current           = opaqueMin;
  opaqueMaxRef.current           = opaqueMax;
  labelVisibleRef.current        = labelVisible;
  atomColorsRef.current          = atomColors;
  pickModeRef.current            = highlightMode && measureEnabled; // legacy compat
  highlightModeRef.current       = highlightMode;
  projModeRef.current            = projMode;
  measureEnabledRef.current      = measureEnabled;
  coordRulesRef.current          = coordRules;
  // pickedSetRef and highlightSetRef updated in highlight useEffect
  // frameAccumRef is managed by Play/Pause/seek handlers; no sync needed here.

  // Register a direct-update function so button handlers can trigger
  // an immediate Three.js scene update without waiting for useEffect.
  triggerUpdateRef.current = (n) => {
    const sc=sceneRef.current, bp=bondPoolRef.current, rp=replicaPoolRef.current;
    if (!sc||!bp||!rp) return;
    const br   = bondRulesRef.current;
    const bon  = br.some(r=>r.enabled);
    const bnr  = bon
      ? bondCacheRef.current(n, frames[n], atomElements, br,
          replicaMarginRef.current, opaqueMinRef.current, opaqueMaxRef.current)
      : null;
    const coordMap = computeCoordHighlightMap(coordRulesRef.current, frames[n], atomElements, br);
    coordHighlightMapRef.current = coordMap;
    updateFrame(n, sc, frames, atomElements, atomScaleRef.current, bnr, bp, rp,
      polyPoolRef.current, polyRulesRef.current, bondRadiusRef.current,
      mirrorPoolRef.current, replicaMarginRenderRef.current,
      opaqueMinRef.current, opaqueMaxRef.current,
      atomColorsRef.current, labelSpritesRef.current, labelVisibleRef.current,
      pickedSetRef.current, highlightSetRef.current, coordMap);
  };

  const uniqueEls    = [...new Set(atomElements)];
  const enabledPairs = bondRules.filter(r => r.enabled);

  return (
    <div>
      <SectionTitle>3D Structure Viewer</SectionTitle>
      {/* Wrapper provides position:relative context for the corner canvas overlay */}
      <div style={{position:"relative",marginBottom:12}}>
        {/* Main 3D viewport — overflow:hidden clips cell wireframe overdraw */}
        <div style={{borderRadius:8,overflow:"hidden",border:"1px solid "+(th?th.border:"#1e3a5f")}}>
          <canvas ref={canvasRef} style={{display:"block",width:"100%",height:480,cursor:"grab"}}/>
          <div style={{position:"absolute",top:10,left:12,background:"rgba(0,0,0,0.65)",borderRadius:6,padding:"7px 11px",fontSize:11,lineHeight:1.8,minWidth:200}}>
            {/* Step counter */}
            <div style={{color:"#93c5fd",fontWeight:600,marginBottom:2}}>
              Step {step+1} / {frames.length}
            </div>
            {/* Lattice parameters */}
            {(()=>{
              const f=frames[step], lat=f.lattice;
              const a=lat[0],b=lat[1],c=lat[2];
              const la=Math.sqrt(a[0]*a[0]+a[1]*a[1]+a[2]*a[2]);
              const lb=Math.sqrt(b[0]*b[0]+b[1]*b[1]+b[2]*b[2]);
              const lc=Math.sqrt(c[0]*c[0]+c[1]*c[1]+c[2]*c[2]);
              const alpha=vecAngleDeg(b,c), beta=vecAngleDeg(a,c), gamma=vecAngleDeg(a,b);
              return (<>
                <div style={{color:"#fb923c"}}>
                  <span style={{opacity:0.75}}>V = </span><span style={{fontFamily:"monospace"}}>{f.volume.toFixed(3)}</span><span style={{opacity:0.75}}> Å<sup>3</sup></span>
                </div>
                <div style={{color:"#f87171"}}>
                  <span style={{opacity:0.75}}>a = </span><span style={{fontFamily:"monospace"}}>{la.toFixed(3)}</span><span style={{opacity:0.75}}> Å,  α = </span><span style={{fontFamily:"monospace"}}>{alpha.toFixed(3)}</span><span style={{opacity:0.75}}> °</span>
                </div>
                <div style={{color:"#4ade80"}}>
                  <span style={{opacity:0.75}}>b = </span><span style={{fontFamily:"monospace"}}>{lb.toFixed(3)}</span><span style={{opacity:0.75}}> Å,  β = </span><span style={{fontFamily:"monospace"}}>{beta.toFixed(3)}</span><span style={{opacity:0.75}}> °</span>
                </div>
                <div style={{color:"#60a5fa"}}>
                  <span style={{opacity:0.75}}>c = </span><span style={{fontFamily:"monospace"}}>{lc.toFixed(3)}</span><span style={{opacity:0.75}}> Å,  γ = </span><span style={{fontFamily:"monospace"}}>{gamma.toFixed(3)}</span><span style={{opacity:0.75}}> °</span>
                </div>
                <div style={{marginTop:5,borderTop:"1px solid rgba(255,255,255,0.12)",paddingTop:4,display:"flex",gap:6,flexWrap:"wrap"}}>
                  {uniqueEls.map(el=>(
                    <div key={el} style={{display:"flex",alignItems:"center",gap:3}}>
                      <div style={{width:9,height:9,borderRadius:"50%",background:atomColor(el),border:"1px solid rgba(255,255,255,0.25)"}}/>
                      <span style={{color:"#e2e8f0",fontSize:10}}>{el}</span>
                    </div>
                  ))}
                </div>
              </>);
            })()}
          </div>
          <div style={{position:"absolute",bottom:10,right:12,background:"rgba(0,0,0,0.72)",borderRadius:5,padding:"4px 8px",fontSize:10,color:"#e2e8f0"}}>
            Drag: rotate &nbsp;|&nbsp; Right-drag / Ctrl+drag: pan &nbsp;|&nbsp; Scroll: zoom
          </div>
        </div>
        {/* Corner axis inset sits OUTSIDE the overflow:hidden container so it is never clipped */}
        {axisMode==="corner" && (
          <canvas ref={cornerCanvasRef}
            style={{position:"absolute",bottom:6,left:6,width:160,height:160,
                    borderRadius:8,pointerEvents:"none",
                    background:"rgba(0,0,0,0.18)",
                    border:"1px solid rgba(255,255,255,0.10)"}}/>
        )}
      </div>

      {/* Row 1: Playback controls */}
      <div style={{display:"flex",alignItems:"center",gap:6,flexWrap:"wrap",marginBottom:8}}>
        <button onClick={()=>{ setPlaying(false); stepRef.current=0; frameAccumRef.current=0; setStep(0); if(triggerUpdateRef.current) triggerUpdateRef.current(0); }} style={btnS("#7f1d1d",th,contrastColor("#7f1d1d"))}>⏮</button>
        <button onClick={()=>{ const n=Math.max(0,stepRef.current-1); stepRef.current=n; frameAccumRef.current=0; setStep(n); if(triggerUpdateRef.current) triggerUpdateRef.current(n); }} style={btnS("#1e3a5f",th,contrastColor("#1e3a5f"))}>◀</button>
        <button onClick={()=>{ frameAccumRef.current=0; setPlaying(p=>!p); }} style={btnS(playing?"#1d4ed8":"#15803d",th,playing?contrastColor("#1d4ed8"):contrastColor("#15803d"))}>{playing?"⏸ Pause":"▶ Play"}</button>
        <button onClick={()=>{ const n=Math.min(frames.length-1,stepRef.current+1); stepRef.current=n; frameAccumRef.current=0; setStep(n); if(triggerUpdateRef.current) triggerUpdateRef.current(n); }} style={btnS("#1e3a5f",th,contrastColor("#1e3a5f"))}>▶</button>
        <button onClick={()=>{ setPlaying(false); const n=frames.length-1; stepRef.current=n; frameAccumRef.current=0; setStep(n); if(triggerUpdateRef.current) triggerUpdateRef.current(n); }} style={btnS("#7f1d1d",th,contrastColor("#7f1d1d"))}>⏭</button>
        <input type="range" min={0} max={frames.length-1} value={step}
          onChange={e=>{ setPlaying(false); const n=+e.target.value; stepRef.current=n; frameAccumRef.current=0; setStep(n); if(triggerUpdateRef.current) triggerUpdateRef.current(n); }}
          style={sliderStyle(step, 0, frames.length-1, "#3b82f6", {flex:1,minWidth:80})}/>
        <div style={{display:"flex",alignItems:"center",gap:5}}>
          <span style={{color:th?th.muted:"#64748b",fontSize:12}}>FPS</span>
          <select value={fps} onChange={e=>setFps(+e.target.value)}
            style={{background:th?th.inputBg:"#1e293b",color:th?th.text:"#e2e8f0",border:"1px solid "+(th?th.borderMid:"#334155"),borderRadius:4,padding:"3px 6px",fontSize:12}}>
            {[1,2,5,10,20,50,100,200,500,1000].map(v=><option key={v} value={v}>{v}</option>)}
          </select>
        </div>
      </div>

      {/* Row 2: Sliders + Projection + Axes (separated by | ) */}
      <div style={{display:"flex",alignItems:"center",gap:4,flexWrap:"wrap",marginBottom:6}}>
        <div style={{display:"flex",alignItems:"center",gap:6}}>
          <span style={{color:th?th.muted:"#64748b",fontSize:12}}>Atom size</span>
          <input type="range" min={0.2} max={2.5} step={0.05} value={atomScale}
            onChange={e=>setAtomScale(+e.target.value)} style={sliderStyle(atomScale, 0.2, 2.5, "#e2e8f0", {width:90})}/>
          <span style={{color:th?th.muted:"#94a3b8",fontSize:12}}>{atomScale.toFixed(2)}x</span>
        </div>
        <span style={{color:th?th.muted:"#475569",fontSize:14,fontWeight:300,margin:"0 4px",userSelect:"none"}}>|</span>
        <div style={{display:"flex",alignItems:"center",gap:6}}>
          <span style={{color:th?th.muted:"#64748b",fontSize:12}}>Bond size</span>
          <input type="range" min={0.1} max={5.0} step={0.1} value={bondScale}
            onChange={e=>setBondScale(+e.target.value)} style={sliderStyle(bondScale, 0.1, 5.0, "#e2e8f0", {width:90})}/>
          <span style={{color:th?th.muted:"#94a3b8",fontSize:12}}>{bondScale.toFixed(1)}x</span>
        </div>
        <span style={{color:th?th.muted:"#475569",fontSize:14,fontWeight:300,margin:"0 4px",userSelect:"none"}}>|</span>
        {/* Projection — Ortho first */}
        <div style={{display:"flex",alignItems:"center",gap:4}}>
          <span style={{color:th?th.muted:"#64748b",fontSize:11}}>Projection</span>
          <div style={{display:"flex",alignItems:"center",gap:0,border:"1px solid "+(th?th.borderMid:"#334155"),borderRadius:5,overflow:"hidden"}}>
            {[["Ortho","orthographic"],["Persp","perspective"]].map(([label,mode])=>{
              const active=projMode===mode;
              return (
                <button key={mode} onClick={()=>setProjMode(mode)} style={{
                  padding:"4px 10px",fontSize:12,cursor:"pointer",border:"none",
                  borderRight:"1px solid "+(th?th.borderMid:"#334155"),
                  background:active?"#1d4ed8":(th?th.inputBg:"#1e293b"),
                  color:active?"#ffffff":(th?th.muted:"#94a3b8"),
                  fontWeight:active?600:400,
                }}>{label}</button>
              );
            })}
          </div>
        </div>
        <span style={{color:th?th.muted:"#475569",fontSize:14,fontWeight:300,margin:"0 4px",userSelect:"none"}}>|</span>
        {/* Axes */}
        <div style={{display:"flex",alignItems:"center",gap:4}}>
          <span style={{color:th?th.muted:"#64748b",fontSize:11}}>Axes</span>
          <div style={{display:"flex",alignItems:"center",gap:0,border:"1px solid "+(th?th.borderMid:"#334155"),borderRadius:5,overflow:"hidden"}}>
            {[["off","Off"],["overlay","Overlay"],["corner","Corner"]].map(([mode,label])=>{
              const active=axisMode===mode;
              return (
                <button key={mode} onClick={()=>setAxisMode(mode)} style={{
                  padding:"4px 10px",fontSize:12,cursor:"pointer",border:"none",
                  borderRight:"1px solid "+(th?th.borderMid:"#334155"),
                  background:active?"#1d4ed8":(th?th.inputBg:"#1e293b"),
                  color:active?"#ffffff":(th?th.muted:"#94a3b8"),
                  fontWeight:active?600:400,
                }}>{label}</button>
              );
            })}
          </div>
        </div>
      </div>

      {/* Row 3: Labels, Cell, Opaque, Bonds, Polyhedra, Colors, Highlight */}
      <div style={{display:"flex",alignItems:"center",gap:6,flexWrap:"wrap",marginBottom:6}}>
        <button onClick={()=>setShowLabelPanel(v=>!v)} style={togBtnStyle(labelVisible.some(Boolean),"#f472b6",th)}>
          Labels
        </button>
        <button onClick={()=>setShowCell(v=>!v)} style={togBtnStyle(showCell,"#22c55e",th)}>
          Cell
        </button>
        <button onClick={()=>setShowOpaquePanel(v=>!v)}
          style={togBtnStyle(opaqueMin.some((v,i)=>v!==0)||opaqueMax.some((v,i)=>v!==1),"#60a5fa",th)}>
          Opaque
        </button>
        <button onClick={()=>setShowBondPanel(v=>!v)} style={togBtnStyle(bondsEnabled,"#3b82f6",th)}>
          Bonds{bondsEnabled?` (${enabledPairs.length})`:"" }
        </button>
        {(()=>{ const polyEnabled=polyRules.some(r=>r.enabled); const polyCount=polyRules.filter(r=>r.enabled).length; return (
          <button onClick={()=>setShowPolyPanel(v=>!v)} style={togBtnStyle(polyEnabled,"#a78bfa",th)}>
            Polyhedra{polyEnabled?` (${polyCount})`:"" }
          </button>
        ); })()}
        <button onClick={()=>setShowColorPanel(v=>!v)} style={togBtnStyle(atomColors.some(Boolean),"#fbbf24",th)}>
          Colors
        </button>
        <button onClick={()=>{ setHighlightMode(p=>!p); if(highlightMode){ setHighlightAtoms([]); setMeasureHistory([]); } }}
          style={togBtnStyle(highlightAtoms.length>0||(highlightMode&&measureHistory.length>0),"#ffaa00",th)}>
          Highlight{highlightAtoms.length>0?` (${highlightAtoms.length})`:"" }
          {highlightMode&&measureEnabled&&<span style={{fontSize:11,marginLeft:2}}>+Meas</span>}
        </button>
        <button onClick={()=>captureScreenshot(sceneRef.current, `xdatcar_step${step+1}.png`)} style={btnS(th?th.inputBg:"#1e293b",th)}>
          📷 Screenshot
        </button>
        <button onClick={()=>setShowRecordingPanel(v=>!v)} style={togBtnStyle(recording.isRecording,"#f87171",th)}>
          🎥 Record{recording.isRecording?" (REC)":""}
        </button>
      </div>
{/* Opaque region panel */}
      {showOpaquePanel && (
        <OpaqueRegionPanel opaqueMin={opaqueMin} opaqueMax={opaqueMax}
          setOpaqueMin={setOpaqueMin} setOpaqueMax={setOpaqueMax} th={th}/>
      )}

      {/* Unified Highlight / Measure panel */}
      {highlightMode && (
        <HighlightMeasurePanel
          th={th} measureEnabled={measureEnabled} setMeasureEnabled={setMeasureEnabled}
          highlightAtoms={highlightAtoms} setHighlightAtoms={setHighlightAtoms}
          measureHistory={measureHistory} setMeasureHistory={setMeasureHistory}
          elementSymbols={elementSymbols} sceneRef={sceneRef} atomElements={atomElements}
          coordRules={coordRules} setCoordRules={setCoordRules} bondsEnabled={bondsEnabled}
        />
      )}
      {showBondPanel && (
        <BondSettings elementSymbols={elementSymbols} bondRules={bondRules} setBondRules={setBondRules}
          replicaMargin={replicaMargin} setReplicaMargin={setReplicaMargin} th={th}/>
      )}
      {showRecordingPanel && (
        <RecordingPanel recording={recording} th={th}/>
      )}
      {showPolyPanel && (
        <PolySettings elementSymbols={elementSymbols} polyRules={polyRules}
          setPolyRules={setPolyRules} th={th}/>
      )}
      {showLabelPanel && (
        <LabelPanel atomElements={atomElements} labelVisible={labelVisible}
          setLabelVisible={setLabelVisible} th={th}/>
      )}
      {showColorPanel && (
        <AtomColorPanel atomElements={atomElements} elementSymbols={elementSymbols}
          atomColors={atomColors} setAtomColors={setAtomColors} th={th}/>
      )}
    </div>
  );
}

// Relative luminance of a hex colour (e.g. "#1d4ed8")
function hexLuminance(hex) {
  const c = hex.replace("#","");
  const r = parseInt(c.slice(0,2),16)/255;
  const g = parseInt(c.slice(2,4),16)/255;
  const b = parseInt(c.slice(4,6),16)/255;
  const lin = v => v<=0.03928 ? v/12.92 : Math.pow((v+0.055)/1.055,2.4);
  return 0.2126*lin(r)+0.7152*lin(g)+0.0722*lin(b);
}
// Pick white or black text so contrast ratio >= ~4.5 against bg.
function contrastColor(bgHex) {
  return hexLuminance(bgHex) > 0.179 ? "#111111" : "#ffffff";
}
// Generic button style: text colour follows theme for neutral bg,
// but callers can override with an explicit text colour (used for
// coloured action buttons whose bg is fixed regardless of theme).
function btnS(bg, th, forcedTextColor) {
  const textColor = forcedTextColor
    ? forcedTextColor
    : (th ? th.text : "#e2e8f0");
  return {
    background: bg,
    border: "1px solid " + (th ? th.borderMid : "#334155"),
    color: textColor,
    borderRadius: 5,
    padding: "5px 12px",
    cursor: "pointer",
    fontSize: 13,
  };
}

// Trigger a browser download for arbitrary text content (used for CSV export).
function downloadTextFile(filename, mime, content) {
  const blob = new Blob([content], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

// Serialize an array of plain row objects to CSV text.
// columns: [{ key, label }] — key indexes into each row, label is the header text.
function toCSV(rows, columns) {
  const esc = v => {
    const s = (v===undefined||v===null) ? "" : String(v);
    return /[",\n]/.test(s) ? `"${s.replace(/"/g,'""')}"` : s;
  };
  const header = columns.map(c => esc(c.label)).join(",");
  const body = rows.map(row => columns.map(c => esc(row[c.key])).join(",")).join("\n");
  return header + "\n" + body;
}

// Download the current 3D view as a PNG. Must render synchronously right
// before reading the canvas: the renderer has no preserveDrawingBuffer, so
// the drawing buffer is only guaranteed valid immediately after render().
function captureScreenshot(sc, filename) {
  if (!sc || !sc.renderer || !sc.scene || !sc.camera) return;
  sc.renderer.render(sc.scene, sc.camera);
  const url = sc.renderer.domElement.toDataURL("image/png");
  const a = document.createElement("a");
  a.href = url; a.download = filename || "xdatcar_view.png";
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
}

// Trigger a browser download for an arbitrary binary Blob (used for video export).
function downloadBlob(filename, blob) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

// Picks the best available MediaRecorder output format, preferring MP4/H.264
// (universally playable) and falling back to WebM variants. Returns null if
// MediaRecorder isn't available at all — callers must handle that case (no
// ffmpeg.wasm or similar is bundled, to keep this a single lightweight file).
// The caller MUST name the downloaded file using the returned `ext`, not
// assume ".mp4" — which exact format gets used is browser-dependent.
function pickRecordingMimeType() {
  if (typeof MediaRecorder === "undefined") return null;
  const candidates = [
    { mime: "video/mp4;codecs=avc1", ext: "mp4" },
    { mime: "video/mp4", ext: "mp4" },
    { mime: "video/webm;codecs=vp9", ext: "webm" },
    { mime: "video/webm;codecs=vp8", ext: "webm" },
    { mime: "video/webm", ext: "webm" },
  ];
  for (const c of candidates) {
    if (MediaRecorder.isTypeSupported(c.mime)) return c;
  }
  return null;
}

// ═══════════════════════════════════════════════════════════════
// useRecording — records the live 3D canvas to a video file.
//
// Wraps canvas.captureStream() + MediaRecorder around whatever is already
// being rendered; it does not touch the existing play/pause/FPS logic at
// all; it just captures the pixels. Auto-starts playback if not already
// playing when recording begins, and (optionally) auto-stops the moment the
// trajectory reaches its last frame — otherwise the caller must call
// stopRecording() manually.
// ═══════════════════════════════════════════════════════════════
function useRecording(sceneRef, step, frames, playingRef, setPlaying) {
  const [isRecording, setIsRecording] = useState(false);
  const [format, setFormat] = useState(null); // {mime, ext} | null
  const mediaRecorderRef = useRef(null);
  const chunksRef = useRef([]);
  const autoStopAtEndRef = useRef(true);

  useEffect(() => { setFormat(pickRecordingMimeType()); }, []);

  const stopRecording = useCallback(() => {
    const mr = mediaRecorderRef.current;
    if (mr && mr.state !== "inactive") mr.stop();
  }, []);

  const startRecording = useCallback(({ fps, autoStopAtEnd }) => {
    const sc = sceneRef.current;
    if (!sc || !sc.renderer || isRecording) return;
    const canvas = sc.renderer.domElement;
    if (typeof canvas.captureStream !== "function") {
      alert("This browser does not support canvas recording (captureStream unavailable).");
      return;
    }
    const fmt = pickRecordingMimeType();
    if (!fmt) {
      alert("This browser does not support video recording (MediaRecorder unavailable).");
      return;
    }
    setFormat(fmt);
    autoStopAtEndRef.current = autoStopAtEnd;
    const stream = canvas.captureStream(fps);
    const mr = new MediaRecorder(stream, { mimeType: fmt.mime });
    chunksRef.current = [];
    mr.ondataavailable = (e) => { if (e.data && e.data.size > 0) chunksRef.current.push(e.data); };
    mr.onstop = () => {
      const blob = new Blob(chunksRef.current, { type: fmt.mime });
      chunksRef.current = [];
      downloadBlob(`xdatcar_animation.${fmt.ext}`, blob);
      setIsRecording(false);
      mediaRecorderRef.current = null;
    };
    mediaRecorderRef.current = mr;
    mr.start();
    setIsRecording(true);
    if (!playingRef.current) setPlaying(true);
  }, [isRecording, sceneRef, playingRef, setPlaying]);

  // Auto-stop the instant playback ARRIVES at the last frame (only while
  // recording). The arrival has to be a transition: playback loops, so a user
  // who parks on the final frame and then hits Record would otherwise have this
  // effect fire on its very first run (isRecording false -> true, step already
  // == last) and stop the recording before a single frame was captured. The
  // first observed step after recording starts is therefore only remembered,
  // never acted on.
  const prevStepRef = useRef(null);
  useEffect(() => {
    if (!isRecording || !autoStopAtEndRef.current) { prevStepRef.current = null; return; }
    const isFirstObservation = prevStepRef.current === null;
    prevStepRef.current = step;
    if (isFirstObservation) return;
    if (step === frames.length - 1) stopRecording();
  }, [step, isRecording, frames.length, stopRecording]);

  // Stop cleanly if the component unmounts mid-recording (new file loaded, etc.)
  useEffect(() => () => {
    const mr = mediaRecorderRef.current;
    if (mr && mr.state !== "inactive") mr.stop();
  }, []);

  return { isRecording, format, startRecording, stopRecording };
}

// ═══════════════════════════════════════════════════════════════
// MSD Panel
// ═══════════════════════════════════════════════════════════════

function DisplacementPanel({parsed,th}){
  const {frames,atomElements,elementSymbols}=parsed;
  const unwrapped = useMemo(()=>computeUnwrappedFractional(frames),[frames]);
  if(frames.length<2) return null;
  const uEls=[...new Set(atomElements)];
  // Accumulate each atom's Cartesian displacement frame-to-frame, converting
  // every step's fractional delta with THAT step's own lattice. This keeps
  // MSD correct for variable-cell (NPT) trajectories (rather than assuming
  // frame 0's cell throughout) and immune to the periodic-boundary jumps a
  // plain positionsRaw diff can show, since the delta comes from the
  // minimum-image-unwrapped trajectory (see computeUnwrappedFractional).
  const nAtoms = atomElements.length;
  const cartDisp = frames.map(()=>new Array(nAtoms));
  cartDisp[0] = atomElements.map(()=>[0,0,0]);
  for (let f=1; f<frames.length; f++) {
    const lat = frames[f].lattice;
    for (let ai=0; ai<nAtoms; ai++) {
      const dFrac = [
        unwrapped[f][ai][0]-unwrapped[f-1][ai][0],
        unwrapped[f][ai][1]-unwrapped[f-1][ai][1],
        unwrapped[f][ai][2]-unwrapped[f-1][ai][2],
      ];
      const dCart = fracToCart(dFrac, lat);
      const prev = cartDisp[f-1][ai];
      cartDisp[f][ai] = [prev[0]+dCart[0], prev[1]+dCart[1], prev[2]+dCart[2]];
    }
  }
  const data=frames.map((f,si)=>{
    const e={step:si+1};
    uEls.forEach(el=>{
      const ids=atomElements.map((x,i)=>x===el?i:-1).filter(i=>i>=0);
      let s=0;
      ids.forEach(ai=>{
        const c=cartDisp[si][ai];
        s+=c[0]*c[0]+c[1]*c[1]+c[2]*c[2];
      });
      e[el]=s/ids.length;
    });
    return e;
  });
  const exportCSV=()=>downloadTextFile("msd_data.csv","text/csv",toCSV(data,[
    {key:"step",label:"Step"},
    ...uEls.map(el=>({key:el,label:`MSD ${el} (A^2)`})),
  ]));
  return (
    <div>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:10}}>
        <SectionTitle style={{margin:0}}>Mean Squared Displacement (MSD)</SectionTitle>
        <button onClick={exportCSV} style={btnS(th?th.inputBg:"#1e293b",th)}>Export CSV</button>
      </div>
      <ResponsiveContainer width="100%" height={220}>
        <LineChart data={data} margin={{top:4,right:20,left:10,bottom:4}}>
          <CartesianGrid strokeDasharray="3 3" stroke="#1e3a5f"/>
          <XAxis dataKey="step" stroke="#64748b" tick={{fill:"#94a3b8",fontSize:11}}/>
          <YAxis stroke="#64748b" tick={{fill:"#94a3b8",fontSize:11}}/>
          <Tooltip content={<CustomTooltip unit="Å²"/>}/>
          <Legend wrapperStyle={{color:"#94a3b8",fontSize:12}}/>
          {uEls.map(el=><Line key={el} type="monotone" dataKey={el} stroke={chartColor(elementSymbols,el)} dot={false} strokeWidth={1.5} name={el}/>)}
        </LineChart>
      </ResponsiveContainer>
    </div>
  );
}

function RDFPanel({parsed,th}){
  const {frames,atomElements}=parsed;
  const [rMax,setRMax]=useState(8);
  const [binWidth,setBinWidth]=useState(0.05);
  const [frameMode,setFrameMode]=useState("current"); // "current" | "average"
  const [frameIdx,setFrameIdx]=useState(0);
  const [pairSel,setPairSel]=useState("ALL");
  const safeFrameIdx = Math.min(frameIdx, frames.length-1);

  const rdf = useMemo(()=>{
    if (frameMode==="current") {
      return computeRDF(frames[safeFrameIdx], atomElements, rMax, binWidth);
    }
    // Average g(r) over all frames (arithmetic mean of each frame's own g(r),
    // so each frame's own volume/lattice is honoured even for NPT runs).
    const per = frames.map(f=>computeRDF(f, atomElements, rMax, binWidth));
    const nBins = per[0].nBins;
    const gAll = new Float64Array(nBins);
    const gByPair = new Map();
    per[0].gByPair.forEach((_,key)=>gByPair.set(key,new Float64Array(nBins)));
    per.forEach(p=>{
      for (let b=0;b<nBins;b++) gAll[b]+=p.gAll[b]/per.length;
      gByPair.forEach((arr,key)=>{ const src=p.gByPair.get(key); for(let b=0;b<nBins;b++) arr[b]+=src[b]/per.length; });
    });
    return { r: per[0].r, gAll, gByPair, nBins };
  }, [frames, atomElements, rMax, binWidth, frameMode, safeFrameIdx]);

  const pairKeys = [...rdf.gByPair.keys()];
  const dataKey = pairSel==="ALL" ? "gAll" : pairSel;
  const chartData = Array.from(rdf.r).map((rVal,i)=>{
    const e = { r: +rVal.toFixed(3), gAll: rdf.gAll[i] };

          <input type="number" min={1} max={30} step={0.5} value={rMax}
            onChange={e=>setRMax(Math.max(0.5,+e.target.value||8))}
            style={{width:56,background:th?th.inputBg:"#1e293b",color:th?th.text:"#e2e8f0",border:"1px solid "+(th?th.borderMid:"#334155"),borderRadius:4,padding:"3px 6px",fontSize:12}}/>
          <span style={{color:th?th.muted:"#64748b",fontSize:11}}>Å</span>
        </div>
        <div style={{display:"flex",alignItems:"center",gap:6}}>
          <span style={{color:th?th.muted:"#64748b",fontSize:12}}>bin width</span>
          <input type="number" min={0.01} max={2} step={0.01} value={binWidth}
            onChange={e=>setBinWidth(Math.max(0.01,+e.target.value||0.05))}

          <span style={{color:th?th.muted:"#64748b",fontSize:11}}>Å</span>

        <div style={{display:"flex",border:"1px solid "+(th?th.borderMid:"#334155"),borderRadius:5,overflow:"hidden"}}>
