    if (!isFinite(mn)) { mn=0; mx=binWidth; }
    if (lo==null) lo=mn;
    if (hi==null) hi=mx;
  }
  if (hi<=lo) hi=lo+binWidth;
  const nBins = Math.max(1, Math.ceil((hi-lo)/binWidth));
  const edges = new Float64Array(nBins+1);
  for (let i=0;i<=nBins;i++) edges[i]=lo+i*binWidth;
  const counts = new Int32Array(nBins);
  values.forEach(v=>{
    let bin = Math.floor((v-lo)/binWidth);
    if (bin<0) bin=0;
    if (bin>=nBins) bin=nBins-1;
    counts[bin]++;
  });
  return { edges, counts, min:lo, max:hi };
}

// Bond-length histogram built directly from an existing bonds[] array
// (see findBondsAndReplicas) — no new distance search needed.
// pairFilter: null for all bonds, or "ElA-ElB" (alphabetically sorted) for one pair.
function computeBondLengthHistogram(bonds, pairFilter, binWidth) {
  const filtered = pairFilter
    ? bonds.filter(b => [b.elA,b.elB].sort().join("-") === pairFilter)
    : bonds;
  return buildHistogram(filtered.map(b=>b.dist), binWidth);
}

// Bond-angle histogram: groups bonds by shared vertex (matched by Cartesian
// position, since the same physical atom/image can appear as either endpoint
// of different bond entries) and measures the angle between every pair of
// bonds meeting at that vertex, reusing measureAngle(). Always binned over
// the physically valid [0,180] range so different triplet selections stay
// comparable on the same axis.
// tripletFilter: null for all angles, or "ElA-ElCenter-ElC" to restrict.
function computeBondAngleHistogram(bonds, tripletFilter, binWidthDeg) {
  const vertexMap = new Map();
  const posKey = p => `${p[0].toFixed(4)},${p[1].toFixed(4)},${p[2].toFixed(4)}`;
  function addNeighbor(centerPos, centerEl, neighborPos, neighborEl) {
    const key = posKey(centerPos);
    if (!vertexMap.has(key)) vertexMap.set(key, { pos:centerPos, el:centerEl, neighbors:[] });
    vertexMap.get(key).neighbors.push({ pos:neighborPos, el:neighborEl });
  }
  bonds.forEach(b => {
    addNeighbor(b.pA, b.elA, b.pB, b.elB);
    addNeighbor(b.pB, b.elB, b.pA, b.elA);
  });

  const values = [];
  vertexMap.forEach(v => {
    const nbrs = v.neighbors;
    for (let i=0;i<nbrs.length;i++)
      for (let j=i+1;j<nbrs.length;j++) {
        if (tripletFilter) {
          const key    = `${nbrs[i].el}-${v.el}-${nbrs[j].el}`;
          const keyRev = `${nbrs[j].el}-${v.el}-${nbrs[i].el}`;
          if (tripletFilter!==key && tripletFilter!==keyRev) continue;
        }
        values.push(measureAngle(nbrs[i].pos, v.pos, nbrs[j].pos));
      }
  });
  return buildHistogram(values, binWidthDeg, 0, 180);
}

function updateFrame(frameIdx, sc, frames, atomElements, atomScale, bondsAndReplicas, bondPool, replicaPool, polyPool, polyRules, bondRadius, mirrorPool, mirrorMargin, opaqueMin, opaqueMax, atomColors, labelSprites, labelVisible, pickedSet, highlightSet, coordHighlightMap) {
  const { atomMeshes, cellLine, geomCache } = sc;
  const frame = frames[frameIdx]; if (!frame) return;
  const lat = frame.lattice;

  sc._lastFrame = frame; // stored for picker fracWrap access

  // --- Unit cell atoms ---
  // opaqueMin/opaqueMax: fractional coord bounds for fully opaque display.
  const _oMin = opaqueMin || [0,0,0];
  const _oMax = opaqueMax || [1,1,1];
  sc._opaqueAtomSet = new Set(); // reset each frame; populated in atom loop below
  atomElements.forEach((el, ai) => {
    const frac = frame.positions[ai];
    const cart = fracToCart(frac, lat);
    atomMeshes[ai].position.set(cart[0], cart[1], cart[2]);
    const r = atomRadius(el) * atomScale;
    atomMeshes[ai].scale.set(r, r, r);

    // Record the atom's base colour for this frame (used below for highlight blend)
    const mat = atomMeshes[ai].material;
    const col = atomColors ? atomColors[ai] : null;
    const baseHexForEl = col || atomColor(el);
    if (mat.uniforms) {
      mat._baseColor = baseHexForEl;
      // Actual uniform.baseColor is set in the opacity/highlight block below
    } else if (mat.color) {
      mat.color.set(baseHexForEl);
      if (!mat._baseColor) mat._baseColor = baseHexForEl;
    }

    const opaque = isInOpaqueRegion(frac, _oMin, _oMax);
    const mat2 = atomMeshes[ai].material;
    if (opaque) sc._opaqueAtomSet.add(ai); // track for picker
    const isPicked    = pickedSet    && pickedSet.has(ai);
    const isHighlight = highlightSet && highlightSet.has(ai);
    const coordHex    = coordHighlightMap ? coordHighlightMap.get(ai) : undefined;
    if (mat2.uniforms) {
      // Shader material: update opacity uniform and depthWrite only
      // (transparent stays true always; toggling it causes shader recompile)
      mat2.uniforms.opacity.value = opaque ? 1.0 : 0.22;
      mat2.depthWrite = opaque;
      const baseHex = mat2._baseColor || atomColor(el);
      const baseCol = new THREE.Color(baseHex);
      if (isPicked) {
        mat2.uniforms.baseColor.value.copy(baseCol.lerp(new THREE.Color(0xffff00), 0.55));
      } else if (isHighlight) {
        mat2.uniforms.baseColor.value.copy(baseCol.lerp(new THREE.Color(0xffaa00), 0.55));
      } else if (coordHex) {
        mat2.uniforms.baseColor.value.copy(baseCol.lerp(new THREE.Color(coordHex), 0.55));
      } else {
        mat2.uniforms.baseColor.value.copy(baseCol);
      }
    } else {
      mat2.opacity     = opaque ? 1.0 : 0.22;
      mat2.transparent = !opaque;
      mat2.depthWrite  = opaque;
      if (isPicked) {
        mat2.emissive.set(0xffff00); mat2.emissiveIntensity = 0.65;
      } else if (isHighlight) {
        mat2.emissive.set(0xffaa00); mat2.emissiveIntensity = 0.70;
      } else if (coordHex) {
        mat2.emissive.set(coordHex); mat2.emissiveIntensity = 0.70;
      } else {
        mat2.emissive.set(0x000000); mat2.emissiveIntensity = 0;
      }
    }
    atomMeshes[ai].visible = true;

    // Update label sprite position
    if (labelSprites && labelSprites[ai]) {
      const vis = labelVisible ? (labelVisible[ai] !== false) : false;
      labelSprites[ai].visible = vis;
      if (vis) labelSprites[ai].position.set(cart[0], cart[1]+r*1.4, cart[2]);
    }
  });

  // --- Update guideline during animation (central atoms move with MD) ---
  if (sc.scene && sc.scene._pickGuide && pickedSet && pickedSet.size > 0) {
    updatePickGuide(sc.scene, [...pickedSet], atomMeshes);
  }

  // --- Cell box ---
  const posAttr = cellLine.geometry.attributes.position;
  const arr = cellEdgePositions(lat);
  for (let i=0; i<arr.length; i++) posAttr.array[i]=arr[i];
  posAttr.needsUpdate = true;

  // --- Update rotation center to (0.5,0.5,0.5) in current lattice ---
  // This keeps the orbit pivot at the cell center even when the lattice
  // changes during an NPT simulation.
  const newCtr = fracToCart([0.5,0.5,0.5], lat);
  sc.ctr[0] = newCtr[0];
  sc.ctr[1] = newCtr[1];
  sc.ctr[2] = newCtr[2];

  // --- Lattice axis arrows ---
  if (sc.axisArrows) updateAxisArrows(sc.axisArrows, lat);

  // --- Bonds ---
  if (bondPool) {
    bondPool.releaseAll();
    if (bondsAndReplicas && bondsAndReplicas.bonds.length)
      bondsAndReplicas.bonds.forEach(b => {
        const m = bondPool.acquire();
        placeBondMesh(m, b.pA, b.pB, bondRadius||BOND_RADIUS);
      });
  }

  // --- Replica (ghost) atoms (bond-based) ---
  if (replicaPool) {
    replicaPool.releaseAll();
    if (bondsAndReplicas && bondsAndReplicas.replicas.length) {
      bondsAndReplicas.replicas.forEach(rep => {
        const m = replicaPool.acquire(rep.el);
        if (!m) return;
        m.position.set(rep.cart[0], rep.cart[1], rep.cart[2]);
        const r = atomRadius(rep.el) * atomScale;
        m.scale.set(r, r, r);
        // Apply opaque region check via inverse lattice
        const repFrac = cartToFrac(rep.cart, lat);
        const repOpaque = isInOpaqueRegion(repFrac, _oMin, _oMax);
        m.material.opacity     = repOpaque ? 1.0 : 0.35;
        m.material.transparent = !repOpaque;
        m.material.depthWrite  = repOpaque;
      });
    }
  }

  // --- Extended display atoms (mirror + opaque region replicas) ---
  // generateDisplayAtoms produces all images of each atom that fall within
  // [oMin-margin, oMax+margin), tagged as opaque or ghost.
  if (mirrorPool) {
    mirrorPool.releaseAll();
    const displayAtoms = generateDisplayAtoms(
      frame.positions, atomElements, lat, _oMin, _oMax, mirrorMargin
    );
    // Tag each acquired mesh with its displayAtom index for O(1) picker lookup
    displayAtoms.forEach((dAtom, dIdx) => {
      const { el, cart, opaque } = dAtom;
      const m = mirrorPool.acquire(el);
      if (!m) return;
      m.position.set(cart[0], cart[1], cart[2]);
      const r = atomRadius(el) * atomScale;
      m.scale.set(r, r, r);
      m.material.opacity     = opaque ? 1.0 : 0.38;
      m.material.transparent = !opaque;
      m.material.depthWrite  = opaque;
      m._displayAtomIdx = dIdx; // direct back-reference for picker
    });
    sc._displayAtoms = displayAtoms; // stored for picker
  }

  // --- Coordination polyhedra ---
  // Draw polyhedra centred on ALL opaque atoms (central cell + opaque mirror images).
  if (polyPool && polyRules) {
    polyPool.releaseAll();
    const enabledRules = polyRules.filter(r => r.enabled);
    if (enabledRules.length > 0 && bondsAndReplicas) {
      // Build a unified list of opaque centre positions from:
      // (a) central cell atoms in the opaque region
      // (b) opaque mirror images (from _displayAtoms)
      const centres = [];
      atomElements.forEach((el, ai) => {
        const frac = frame.positions[ai];
        if (isInOpaqueRegion(frac, _oMin, _oMax)) {
          centres.push({ el, ai, cart:[atomMeshes[ai].position.x,atomMeshes[ai].position.y,atomMeshes[ai].position.z] });
        }
      });
      if (sc._displayAtoms) {
        sc._displayAtoms.forEach(d => {
          if (d.opaque) centres.push({ el:d.el, ai:d.ai, cart:d.cart });
        });
      }

      centres.forEach(({ el, ai, cart: centre }) => {
        const rule = enabledRules.find(r => r.centerEl === el);
        if (!rule) return;
        // Find ligands: every bond with an endpoint drawn AT this centre.
        // bonds[] is endpoint-deduplicated, so a given physical bond is stored
        // once, arbitrarily oriented by whichever atom the search happened to
        // reach first. Matching only the pA end therefore drops every bond that
        // was recorded from the neighbour's side, which silently truncated the
        // ligand set (e.g. rocksalt NaCl: the Cl sublattice saw 3 of its 6
        // ligands and its octahedra collapsed). Both ends are checked here, and
        // the "endpoint coincides with the centre being drawn" test is what
        // keeps a periodic image's ligands from leaking onto the home atom.
        const nearCentre = p =>
          Math.abs(p[0]-centre[0])<0.01 &&
          Math.abs(p[1]-centre[1])<0.01 &&
          Math.abs(p[2]-centre[2])<0.01;
        const ligands = [];
        bondsAndReplicas.bonds.forEach(b => {
          if (b.ai===ai && rule.coordEls.has(b.elB) && nearCentre(b.pA)) ligands.push(b.pB);
          else if (b.aj===ai && rule.coordEls.has(b.elA) && nearCentre(b.pB)) ligands.push(b.pA);
        });
        if (ligands.length < 3) return;
        const mesh = polyPool.acquire(rule.color, rule.opacity);
        placePolyMesh(mesh, centre, ligands);
      });
    }
  }
}



// ═══════════════════════════════════════════════════════════════
// (1) Opaque Region Panel
// ═══════════════════════════════════════════════════════════════
function OpaqueRegionPanel({ opaqueMin, opaqueMax, setOpaqueMin, setOpaqueMax, th }) {
  const axes = ["a","b","c"];
  const updMin = (k,v) => { const f=parseFloat(v); if (isNaN(f)) return; setOpaqueMin(prev => { const n=[...prev]; n[k]=f; return n; }); };
  const updMax = (k,v) => { const f=parseFloat(v); if (isNaN(f)) return; setOpaqueMax(prev => { const n=[...prev]; n[k]=f; return n; }); };
  const isDefault = opaqueMin.every((v,i)=>v===0) && opaqueMax.every((v,i)=>v===1);
  return (
    <div style={{background:th?th.panelAlt:"#0f172a",border:"1px solid "+(th?th.border:"#1e3a5f"),
                 borderRadius:8,padding:"12px 16px",marginTop:8}}>
      <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:8}}>
        <span style={{color:"#93c5fd",fontSize:12,fontWeight:600,letterSpacing:"0.05em",textTransform:"uppercase"}}>
          Opaque Display Region (fractional coords)
        </span>
        <button onClick={()=>{ setOpaqueMin([0,0,0]); setOpaqueMax([1,1,1]); }}
          style={sBtn("#1e3a5f")}>Reset to unit cell</button>
      </div>
      <div style={{color:th?th.mutedAlt:"#475569",fontSize:11,marginBottom:10}}>
        Atoms within [min, max) per axis are shown fully opaque; others are ghosted (22% opacity).
      </div>
      <div style={{display:"inline-grid",gridTemplateColumns:"24px 72px 72px",gap:4,alignItems:"center"}}>
        <span/><span style={{color:th?th.muted:"#64748b",fontSize:11,textAlign:"center"}}>Min</span>
        <span style={{color:th?th.muted:"#64748b",fontSize:11,textAlign:"center"}}>Max</span>
        {axes.map((ax,k)=>[
          <span key={"l"+k} style={{color:ax==="a"?"#f87171":ax==="b"?"#34d399":"#60a5fa",fontSize:13,fontWeight:700}}>{ax}</span>,
          <input key={"mn"+k} type="number" step={0.05} value={opaqueMin[k]}
            onChange={e=>updMin(k,e.target.value)}
            style={{background:th?th.inputBg:"#1e293b",border:"1px solid "+(th?th.borderMid:"#334155"),
                    color:th?th.text:"#e2e8f0",borderRadius:4,padding:"3px 4px",fontSize:12,width:"100%"}}/>,
          <input key={"mx"+k} type="number" step={0.05} value={opaqueMax[k]}
            onChange={e=>updMax(k,e.target.value)}
            style={{background:th?th.inputBg:"#1e293b",border:"1px solid "+(th?th.borderMid:"#334155"),
                    color:th?th.text:"#e2e8f0",borderRadius:4,padding:"3px 4px",fontSize:12,width:"100%"}}/>,
        ])}
      </div>
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════
// (2) Label Panel
// ═══════════════════════════════════════════════════════════════
function LabelPanel({ atomElements, labelVisible, setLabelVisible, th }) {
  const uniqueEls = [...new Set(atomElements)];
  const toggleEl = (el, on) => setLabelVisible(prev => {
    const next = [...prev];
    atomElements.forEach((e,i) => { if(e===el) next[i]=on; });
    return next;
  });
  const toggleAtom = (ai, on) => setLabelVisible(prev => {
    const next=[...prev]; next[ai]=on; return next;
  });
  return (
    <div style={{background:th?th.panelAlt:"#0f172a",border:"1px solid "+(th?th.border:"#1e3a5f"),
                 borderRadius:8,padding:"12px 16px",marginTop:8}}>
      <div style={{color:"#93c5fd",fontSize:12,fontWeight:600,letterSpacing:"0.05em",textTransform:"uppercase",marginBottom:8}}>
        Atom Labels
      </div>
      <div style={{color:th?th.mutedAlt:"#475569",fontSize:11,marginBottom:10}}>
        Labels are displayed at atom centres (Si1, Si2, …). Toggle per element or per atom.
      </div>
      {/* Per-element bulk toggles */}
      <div style={{display:"flex",gap:8,flexWrap:"wrap",marginBottom:10}}>
        {uniqueEls.map(el => {
          const indices = atomElements.map((e,i)=>e===el?i:-1).filter(i=>i>=0);
          const allOn = indices.every(i=>labelVisible[i]);
          const col = atomColor(el);
          return (
            <div key={el} style={{display:"flex",alignItems:"center",gap:4}}>
              <div style={{width:9,height:9,borderRadius:"50%",background:col}}/>
              <span style={{color:th?th.text:"#e2e8f0",fontSize:12,fontWeight:600}}>{el}</span>
              <button onClick={()=>toggleEl(el,true)}
                style={{...sBtn(allOn?"#15803d":"#1e293b"),padding:"1px 7px",fontSize:11}}>All on</button>
              <button onClick={()=>toggleEl(el,false)}
                style={{...sBtn("#7f1d1d"),padding:"1px 7px",fontSize:11}}>Off</button>
            </div>
          );
        })}
        <button onClick={()=>setLabelVisible(new Array(atomElements.length).fill(true))}
          style={sBtn("#15803d")}>Show all</button>
        <button onClick={()=>setLabelVisible(new Array(atomElements.length).fill(false))}
          style={sBtn("#7f1d1d")}>Hide all</button>
      </div>
      {/* Per-atom toggles */}
      <div style={{display:"flex",flexWrap:"wrap",gap:4}}>
        {atomElements.map((el,ai)=>{
          const on=labelVisible[ai]; const col=atomColor(el);
          return (
            <button key={ai} onClick={()=>toggleAtom(ai,!on)} style={{
              padding:"2px 6px",borderRadius:4,fontSize:10,cursor:"pointer",
              background:on?col+"33":"transparent",color:on?col:(th?th.mutedAlt:"#475569"),
              border:"1px solid "+(on?col:(th?th.borderMid:"#334155")),
            }}>
              {el}{ai+1}
            </button>
          );
        })}
      </div>
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════
// (3) Atom Colour Panel
// ═══════════════════════════════════════════════════════════════
function AtomColorPanel({ atomElements, elementSymbols, atomColors, setAtomColors, th }) {
  const uniqueEls = [...new Set(atomElements)];
  const setAtomColor = (ai, col) => setAtomColors(prev => {
    const next=[...prev]; next[ai]=col||null; return next;
  });
  const setElColor = (el, col) => setAtomColors(prev => {
    const next=[...prev];
    atomElements.forEach((e,i)=>{ if(e===el) next[i]=col||null; });
    return next;
  });
  const resetAll = () => setAtomColors(new Array(atomElements.length).fill(null));
  return (
    <div style={{background:th?th.panelAlt:"#0f172a",border:"1px solid "+(th?th.border:"#1e3a5f"),
                 borderRadius:8,padding:"12px 16px",marginTop:8}}>
      <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:8}}>
        <span style={{color:"#93c5fd",fontSize:12,fontWeight:600,letterSpacing:"0.05em",textTransform:"uppercase"}}>
          Atom Colours
        </span>
        <button onClick={resetAll} style={sBtn("#1e3a5f")}>Reset all to CPK</button>
      </div>
      <div style={{color:th?th.mutedAlt:"#475569",fontSize:11,marginBottom:10}}>
        Set colour per element (bulk) or per individual atom. Null = default CPK colour.
      </div>
      {/* Per-element colour picker */}
      <div style={{display:"flex",gap:10,flexWrap:"wrap",marginBottom:10}}>
        {uniqueEls.map(el => {
          const defaultCol = atomColor(el);
          const indices = atomElements.map((e,i)=>e===el?i:-1).filter(i=>i>=0);
          const current = atomColors[indices[0]] || defaultCol;
          return (
            <div key={el} style={{display:"flex",alignItems:"center",gap:5}}>
              <div style={{width:9,height:9,borderRadius:"50%",background:defaultCol}}/>
              <span style={{color:th?th.text:"#e2e8f0",fontSize:12,fontWeight:600}}>{el}</span>
              <input type="color" value={current}
                onChange={e=>setElColor(el,e.target.value)}
                style={{width:36,height:22,border:"none",borderRadius:3,cursor:"pointer",padding:0,background:"none"}}/>
              <button onClick={()=>setElColor(el,null)} style={{...sBtn("#1e3a5f"),padding:"1px 6px",fontSize:10}}>CPK</button>
            </div>
          );
        })}
      </div>
      {/* Per-atom colour pickers */}
      <div style={{display:"flex",flexWrap:"wrap",gap:4}}>
        {atomElements.map((el,ai)=>{
          const defCol=atomColor(el);
          const cur=atomColors[ai]||defCol;
          const custom=!!atomColors[ai];
          return (
            <div key={ai} style={{display:"flex",alignItems:"center",gap:2,
              border:"1px solid "+(custom?cur:(th?th.borderMid:"#334155")),
              borderRadius:4,padding:"1px 4px",
            }}>
              <span style={{color:th?th.text:"#e2e8f0",fontSize:10}}>{el}{ai+1}</span>
              <input type="color" value={cur}
                onChange={e=>setAtomColor(ai,e.target.value)}
                style={{width:22,height:16,border:"none",padding:0,cursor:"pointer",background:"none"}}/>
            </div>
          );
        })}
      </div>
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════
// Polyhedron Settings UI
// ═══════════════════════════════════════════════════════════════

function PolySettings({ elementSymbols, polyRules, setPolyRules, th }) {
  const updRule = (key, field, val) =>
    setPolyRules(prev => prev.map(r => r.key === key ? { ...r, [field]: val } : r));

  const toggleCoordEl = (key, el) =>
    setPolyRules(prev => prev.map(r => {
      if (r.key !== key) return r;
      const next = new Set(r.coordEls);
      if (next.has(el)) next.delete(el); else next.add(el);
      return { ...r, coordEls: next };
    }));

  return (
    <div style={{background:th?th.panelAlt:"#0f172a",border:"1px solid "+(th?th.border:"#1e3a5f"),
                 borderRadius:8,padding:"14px 16px",marginTop:10}}>
      <div style={{color:"#93c5fd",fontSize:12,fontWeight:600,letterSpacing:"0.05em",
                   textTransform:"uppercase",marginBottom:10}}>
        Polyhedra Settings
      </div>
      <div style={{color:th?th.mutedAlt:"#475569",fontSize:11,marginBottom:10,lineHeight:1.5}}>
        For each central atom element, select which ligand elements define the polyhedron vertices.
        Bonds must be enabled and detected for the relevant pairs.
      </div>

      {/* Column headers */}
      <div style={{display:"grid",gridTemplateColumns:"60px 36px 48px 80px 1fr",
                   gap:6,alignItems:"center",marginBottom:6}}>
        <span style={{color:th?th.muted:"#475569",fontSize:11}}>Center</span>
        <span style={{color:th?th.muted:"#475569",fontSize:11}}>Show</span>
        <span style={{color:th?th.muted:"#475569",fontSize:11}}>Color</span>
        <span style={{color:th?th.muted:"#475569",fontSize:11}}>Opacity</span>
        <span style={{color:th?th.muted:"#475569",fontSize:11}}>Ligand elements</span>
      </div>

      {polyRules.map(rule => (
        <div key={rule.key} style={{display:"grid",gridTemplateColumns:"60px 36px 48px 80px 1fr",
                                    gap:6,alignItems:"center",marginBottom:8,
                                    opacity:rule.enabled?1:0.5}}>
          {/* Center */}
          <div style={{display:"flex",alignItems:"center",gap:4}}>
            <div style={{width:9,height:9,borderRadius:"50%",background:atomColor(rule.centerEl)}}/>
            <span style={{color:th?th.text:"#e2e8f0",fontSize:12,fontWeight:600}}>{rule.centerEl}</span>
          </div>

          {/* Show */}
          <label style={{display:"flex",alignItems:"center",cursor:"pointer"}}>
            <input type="checkbox" checked={rule.enabled}
              onChange={e=>updRule(rule.key,"enabled",e.target.checked)}
              style={{accentColor:"#3b82f6",width:14,height:14,cursor:"pointer"}}/>
          </label>

          {/* Color */}
          <input type="color" value={rule.color}
            onChange={e=>updRule(rule.key,"color",e.target.value)}
            disabled={!rule.enabled}
            style={{width:40,height:22,border:"none",borderRadius:3,cursor:rule.enabled?"pointer":"default",
                    background:"none",padding:0}}/>

          {/* Opacity */}
          <div style={{display:"flex",alignItems:"center",gap:3}}>
            <input type="range" min={0.05} max={1} step={0.05} value={rule.opacity}
              onChange={e=>updRule(rule.key,"opacity",+e.target.value)}
              disabled={!rule.enabled}
              style={sliderStyle(rule.opacity, 0.05, 1, "#a78bfa", {width:42})}/>
            <span style={{color:th?th.muted:"#64748b",fontSize:10,minWidth:20}}>
              {Math.round(rule.opacity*100)}%
            </span>
          </div>

          {/* Ligand elements */}
          <div style={{display:"flex",gap:3,flexWrap:"wrap"}}>
            {elementSymbols.map(el => {
              const on = rule.coordEls.has(el);
              const col = atomColor(el);
              return (
                <button key={el} onClick={()=>toggleCoordEl(rule.key,el)}
                  disabled={!rule.enabled}
                  style={{padding:"1px 6px",borderRadius:3,fontSize:10,cursor:rule.enabled?"pointer":"default",
                          background:on?col+"33":"transparent",
                          color:on?col:(th?th.mutedAlt:"#475569"),
                          border:"1px solid "+(on?col:(th?th.borderMid:"#334155"))}}>
                  {el}
                </button>
              );
            })}
          </div>
        </div>
      ))}

      {/* Bulk actions */}
      <div style={{display:"flex",gap:8,marginTop:8}}>
        <button onClick={()=>setPolyRules(p=>p.map(r=>({...r,enabled:true})))}
          style={sBtn("#15803d")}>Enable all</button>
        <button onClick={()=>setPolyRules(p=>p.map(r=>({...r,enabled:false})))}
          style={sBtn("#7f1d1d")}>Disable all</button>
        <button onClick={()=>setPolyRules(buildDefaultPolyRules(elementSymbols))}
          style={sBtn("#1e3a5f")}>Reset</button>
      </div>
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════
// CoordHighlightRules
// UI for defining coordination-number based highlight rules:
// "highlight CenterEl atoms that have exactly N bonds to TargetEl"
// ═══════════════════════════════════════════════════════════════
function CoordHighlightRules({ elementSymbols, coordRules, setCoordRules, bondsEnabled, th }) {
  const addRule = () => {
    setCoordRules(prev => [...prev, {
      key: "cr"+Date.now()+Math.random().toString(36).slice(2,6),
      centerEl: elementSymbols[0] || "",
      targetEl: "ANY",
      coordNum: 4,
      color: "#ffaa00",
      enabled: true,
    }]);
  };
  const removeRule = (key) => setCoordRules(prev => prev.filter(r => r.key !== key));
  const updRule = (key, field, value) =>
    setCoordRules(prev => prev.map(r => r.key === key ? { ...r, [field]: value } : r));

  return (
    <div style={{marginTop:10,paddingTop:8,borderTop:"1px solid "+(th?th.border:"#1e3a5f")}}>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:6}}>
        <span style={{color:th?th.muted:"#94a3b8",fontSize:11,fontWeight:600}}>
          Coordination-based highlight rules
        </span>
        <button onClick={addRule} style={{...sBtn("#164e35"),padding:"2px 9px",fontSize:11}}>+ Add</button>
      </div>

      {!bondsEnabled && coordRules.length>0 && (
        <div style={{color:"#fbbf24",fontSize:10,marginBottom:6}}>
          Bonds must be enabled for coordination rules to take effect.
        </div>
      )}

      {coordRules.length === 0 && (
        <div style={{color:th?th.mutedAlt:"#475569",fontSize:11}}>
          No rules yet. Click "+ Add" to highlight atoms by coordination number
          (e.g. center=Si, target=O, coord=4 → highlight 4-coordinated Si).
        </div>
      )}

      {coordRules.map(rule => (
        <div key={rule.key} style={{
          display:"grid",
          gridTemplateColumns:"22px 60px 16px 70px 50px 40px 28px 28px",
          gap:5, alignItems:"center", marginBottom:5,
          opacity: rule.enabled ? 1 : 0.45,
        }}>
          {/* Enable toggle */}
          <input type="checkbox" checked={rule.enabled}
            onChange={e=>updRule(rule.key,"enabled",e.target.checked)}
            style={{accentColor:"#22c55e",width:14,height:14,cursor:"pointer"}}/>

          {/* Center element */}
          <select value={rule.centerEl} onChange={e=>updRule(rule.key,"centerEl",e.target.value)}
            style={{background:th?th.inputBg:"#1e293b",border:"1px solid "+(th?th.borderMid:"#334155"),
                    color:th?th.text:"#e2e8f0",borderRadius:4,padding:"2px 4px",fontSize:11}}>
            {elementSymbols.map(el=><option key={el} value={el}>{el}</option>)}
          </select>

          <span style={{color:th?th.muted:"#64748b",fontSize:10,textAlign:"center"}}>w/</span>

          {/* Target element (or ANY) */}
          <select value={rule.targetEl} onChange={e=>updRule(rule.key,"targetEl",e.target.value)}
            style={{background:th?th.inputBg:"#1e293b",border:"1px solid "+(th?th.borderMid:"#334155"),
                    color:th?th.text:"#e2e8f0",borderRadius:4,padding:"2px 4px",fontSize:11}}>
            <option value="ANY">Any elem.</option>
            {elementSymbols.map(el=><option key={el} value={el}>{el}</option>)}
          </select>

          {/* Coordination number */}
          <input type="number" min={0} max={24} value={rule.coordNum}
            onChange={e=>updRule(rule.key,"coordNum",e.target.value===""?"":+e.target.value)}
            style={{background:th?th.inputBg:"#1e293b",border:"1px solid "+(th?th.borderMid:"#334155"),
                    color:th?th.text:"#e2e8f0",borderRadius:4,padding:"2px 4px",fontSize:11,width:"100%"}}/>

          <span style={{color:th?th.muted:"#64748b",fontSize:10,textAlign:"center"}}>coord</span>

          {/* Color picker */}
          <input type="color" value={rule.color}
            onChange={e=>updRule(rule.key,"color",e.target.value)}
            style={{width:26,height:22,border:"none",borderRadius:3,cursor:"pointer",background:"none",padding:0}}/>

          {/* Delete */}
          <button onClick={()=>removeRule(rule.key)}
            style={{background:"transparent",border:"none",color:"#f87171",cursor:"pointer",fontSize:14,padding:0}}>
            ✕
          </button>
        </div>
      ))}
    </div>
  );

// Cross-browser range slider style: computes the fill percentage and
// passes it (plus the accent colour) as CSS custom properties consumed
// by the global input[type=range] CSS rules. This ensures Safari shows
// the same coloured track fill as Chrome.
function sliderStyle(value, min, max, color, extra) {
  const pct = max > min ? ((value - min) / (max - min)) * 100 : 0;
  return {
    "--pct": pct + "%",
    "--range-color": color,
    ...extra,
  };
}
